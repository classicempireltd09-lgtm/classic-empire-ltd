function startExam(){

const name=
document.getElementById("candidateName").value.trim();

const code=
document.getElementById("examCode").value.trim().toUpperCase();

const post=
document.getElementById("postSelect").value;

const message=
document.getElementById("loginMessage");


if(name===""){

message.style.color="#ff6464";
message.textContent="Please enter candidate name.";

return;

}


if(code===""){

message.style.color="#ff6464";
message.textContent="Please enter examination code.";

return;

}


if(post===""){

message.style.color="#ff6464";
message.textContent="Please select an examination post.";

return;

}


if(code!=="CE-TEST-123456"){

message.style.color="#ff6464";
message.textContent="Invalid examination code.";

return;

}


document.getElementById("loginBox").style.display="none";

document.getElementById("examArea").style.display="block";

document.getElementById("showName").textContent=name;

document.getElementById("showPost").textContent=post;

loadQuestions(post);

window.scrollTo(0,0);

}


function loadQuestions(post){

const area=
document.getElementById("questions");

area.innerHTML="";

const paper=examData[post];

paper.forEach((item,index)=>{

let html="";

html+=`
<div class="question">

<div class="question-number">
Question ${index+1}
</div>

<div class="type">
${item.type}
</div>

<p>
${escapeHTML(item.question)}
</p>
`;

if(item.type==="SUBJECTIVE"){

html+=`

<textarea
id="subjective${index}"
placeholder="Write your answer here..."
></textarea>

`;

}else{

item.options.forEach((option,optIndex)=>{

const letter=
String.fromCharCode(65+optIndex);

html+=`

<label class="option">

<input
type="radio"
name="q${index}"
value="${optIndex}"
>

${letter}. ${escapeHTML(option)}

</label>

`;

});

}

html+=`</div>`;

area.innerHTML+=html;

});

}


function submitExam(){

const post=
document.getElementById("showPost").textContent;

const paper=
examData[post];

let score=0;

let unanswered=0;

let subjective=0;


paper.forEach((item,index)=>{

if(item.type==="SUBJECTIVE"){

subjective++;

return;

}


const selected=
document.querySelector(
'input[name="q'+index+'"]:checked'
);


if(!selected){

unanswered++;

return;

}


if(Number(selected.value)===item.answer){

score++;

}

});


const totalObjective=
paper.length-subjective;

const percentage=
Math.round((score/totalObjective)*100);

const passed=
percentage>=60;


document.getElementById("examArea").style.display="none";

document.getElementById("result").style.display="block";


const resultText=
document.getElementById("resultText");

const scoreText=
document.getElementById("scoreText");


if(passed){

resultText.className="pass";

resultText.textContent=
"PASS — Objective Section";

}else{

resultText.className="fail";

resultText.textContent=
"FAIL — Objective Section";

}


scoreText.innerHTML=`

<p style="text-align:center;font-size:20px;">

<strong>Objective Score:</strong>
${score} / ${totalObjective}

<br>

<strong>Percentage:</strong>
${percentage}%

<br>

<strong>Unanswered:</strong>
${unanswered}

<br>

<strong>Subjective Questions:</strong>
${subjective}

</p>

<hr>

<p style="text-align:center;color:#aaa;">

Passing threshold:
60% in the automatically scored objective section.

</p>

`;


window.scrollTo(0,0);

}


function escapeHTML(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}

</script>
