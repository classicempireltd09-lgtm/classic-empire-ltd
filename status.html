<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Classic Empire Ltd - Application Status</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#0b0b0b;
  color:#fff;
  min-height:100vh;
}

header{
  background:#111;
  border-bottom:1px solid #c9a227;
  padding:20px;
  text-align:center;
}

header h1{
  color:#d4af37;
  font-size:26px;
}

header p{
  color:#aaa;
  margin-top:6px;
}

.container{
  width:92%;
  max-width:650px;
  margin:35px auto;
}

.card{
  background:#151515;
  border:1px solid #333;
  border-radius:15px;
  padding:25px;
  box-shadow:0 0 20px rgba(212,175,55,.08);
}

h2{
  color:#d4af37;
  margin-bottom:20px;
  text-align:center;
}

label{
  display:block;
  margin-bottom:8px;
  color:#ddd;
}

input{
  width:100%;
  padding:13px;
  border-radius:8px;
  border:1px solid #444;
  background:#0d0d0d;
  color:#fff;
  outline:none;
  margin-bottom:15px;
}

input:focus{
  border-color:#d4af37;
}

button{
  width:100%;
  padding:13px;
  border:none;
  border-radius:8px;
  background:#d4af37;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#f0cc55;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.result{
  margin-top:25px;
  display:none;
}

.info{
  background:#101010;
  border:1px solid #333;
  border-radius:10px;
  padding:15px;
  margin-top:12px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:10px 0;
  border-bottom:1px solid #292929;
}

.row:last-child{
  border-bottom:none;
}

.title{
  color:#aaa;
}

.value{
  text-align:right;
  font-weight:bold;
}

.status{
  color:#d4af37;
}

.code-box{
  margin-top:20px;
  padding:20px;
  text-align:center;
  background:#0c0c0c;
  border:2px solid #d4af37;
  border-radius:12px;
}

.code{
  font-size:26px;
  color:#d4af37;
  font-weight:bold;
  letter-spacing:2px;
  margin:10px 0;
  word-break:break-word;
}

.waiting{
  margin-top:20px;
  padding:18px;
  border-radius:10px;
  background:#211d0d;
  border:1px solid #8d7422;
  text-align:center;
}

.timer{
  font-size:28px;
  color:#d4af37;
  font-weight:bold;
  margin-top:8px;
}

.success{
  background:#102414;
  border:1px solid #2c7138;
  color:#8ee59a;
}

.warning{
  background:#241d0d;
  border:1px solid #8d7422;
  color:#f2d477;
}

.error{
  background:#241010;
  border:1px solid #743333;
  color:#ff9999;
}

.exam-btn{
  display:block;
  text-decoration:none;
  text-align:center;
  margin-top:15px;
  padding:13px;
  border-radius:8px;
  background:#d4af37;
  color:#000;
  font-weight:bold;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#d4af37;
  text-decoration:none;
}

.small{
  color:#999;
  font-size:13px;
  margin-top:8px;
}

footer{
  text-align:center;
  color:#777;
  padding:30px 10px;
}
</style>
</head>

<body>

<header>
  <h1>Classic Empire Ltd</h1>
  <p>Application Status</p>
</header>

<div class="container">

  <div class="card">

    <h2>📋 Check Application Status</h2>

    <label for="email">
      Applicant Email
    </label>

    <input
      type="email"
      id="email"
      placeholder="Enter your application email"
      autocomplete="email"
    >

    <button id="checkBtn" onclick="checkStatus()">
      Check Status
    </button>

    <div id="result" class="result"></div>

    <a href="index.html" class="back">
      ← Back to Classic Empire Ltd
    </a>

  </div>

</div>

<footer>
  Classic Empire Ltd
</footer>


<script>

const SUPABASE_URL =
"https://hjatspkzgoddcpgwfkxo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_nw9-8f_8dfZBN7M2q27Wrg_NXk6Eij_";

let countdownInterval = null;


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================
   FORMAT DATE
========================================= */

function formatDate(value){

  if(!value) return "-";

  const date = new Date(value);

  return date.toLocaleString(
    "en-IN",
    {
      day:"2-digit",
      month:"short",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit"
    }
  );

}


/* =========================================
   CHECK APPLICATION STATUS
========================================= */

async function checkStatus(){

  const email =
    document.getElementById("email").value.trim();

  const resultBox =
    document.getElementById("result");

  const checkBtn =
    document.getElementById("checkBtn");


  if(!email){

    resultBox.style.display = "block";

    resultBox.innerHTML = `
      <div class="info error">
        Please enter your Applicant Email.
      </div>
    `;

    return;
  }


  if(countdownInterval){

    clearInterval(countdownInterval);

    countdownInterval = null;

  }


  checkBtn.disabled = true;

  checkBtn.textContent = "Checking...";

  resultBox.style.display = "block";

  resultBox.innerHTML = `
    <div class="info">
      Checking application status...
    </div>
  `;


  try{

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/rpc/get_application_status",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json",
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY
        },

        body:JSON.stringify({
          input_applicant_email:email
        })
      }
    );


    const data = await response.json();


    if(!response.ok){

      throw new Error(
        data.message ||
        "Unable to check application."
      );

    }


    if(!data.success){

      resultBox.innerHTML = `
        <div class="info error">
          ${escapeHtml(
            data.message ||
            "Application नहीं मिली"
          )}
        </div>
      `;

      return;

    }


    renderStatus(data);

  }

  catch(error){

    resultBox.innerHTML = `
      <div class="info error">
        ${escapeHtml(
          error.message ||
          "Something went wrong."
        )}
      </div>
    `;

  }

  finally{

    checkBtn.disabled = false;

    checkBtn.textContent = "Check Status";

  }

}


/* =========================================
   RENDER STATUS
========================================= */

function renderStatus(data){

  const resultBox =
    document.getElementById("result");


  const status =
    data.status || "Pending";

  const examCode =
    data.exam_code || null;

  const unlockAt =
    data.unlock_at || null;

  const codeUsed =
    data.code_used === true;


  let html = `

    <div class="info">

      <div class="row">
        <span class="title">
          Applicant
        </span>

        <span class="value">
          ${escapeHtml(data.applicant_name)}
        </span>
      </div>


      <div class="row">
        <span class="title">
          Applied Post
        </span>

        <span class="value">
          ${escapeHtml(data.post)}
        </span>
      </div>


      <div class="row">
        <span class="title">
          Application Status
        </span>

        <span class="value status">
          ${escapeHtml(status)}
        </span>
      </div>

    </div>

  `;


  /* =====================================
     PENDING
  ===================================== */

  if(status === "Pending"){

    html += `

      <div class="info warning">

        ⏳ Your application is still under Admin review.

        <div class="small">
          Exam Code will be generated after approval.
        </div>

      </div>

    `;

    resultBox.innerHTML = html;

    return;

  }


  /* =====================================
     REJECTED
  ===================================== */

  if(status === "Rejected"){

    html += `

      <div class="info error">

        ❌ Your application has been rejected.

      </div>

    `;

    resultBox.innerHTML = html;

    return;

  }


  /* =====================================
     APPROVED
  ===================================== */

  if(status === "Approved"){

    /*
      Code is still locked
    */

    if(!examCode && unlockAt){

      html += `

        <div class="waiting">

          🔐 Exam Code Generated

          <div class="small">
            Your Exam Code will become visible
            after the 2-hour waiting period.
          </div>

          <div class="small">
            Unlock Time:
            ${escapeHtml(formatDate(unlockAt))}
          </div>

          <div class="timer" id="countdown">
            Calculating...
          </div>

        </div>

      `;

      resultBox.innerHTML = html;

      startCountdown(
        unlockAt
      );

      return;

    }


    /*
      Code available
    */

    if(examCode){

      if(codeUsed){

        html += `

          <div class="code-box">

            <div>
              🔐 Exam Code
            </div>

            <div class="code">
              ${escapeHtml(examCode)}
            </div>

            <div class="small">
              This Exam Code has already been used.
            </div>

          </div>

        `;

      }else{

        html += `

          <div class="code-box">

            <div>
              🔐 Your Exam Code
            </div>

            <div class="code">
              ${escapeHtml(examCode)}
            </div>

            <div class="small">
              Your Exam Code is now available.
            </div>

          </div>

          <a
            href="exam.html"
            class="exam-btn"
          >
            📝 Open Exam Portal
          </a>

        `;

      }


      resultBox.innerHTML = html;

      return;

    }


    /*
      Approved but code not ready
    */

    html += `

      <div class="info warning">

        ✅ Application Approved.

        <div class="small">
          Your Exam Code is being prepared.
          Please check again later.
        </div>

      </div>

    `;

    resultBox.innerHTML = html;

    return;

  }


  resultBox.innerHTML = html;

}


/* =========================================
   COUNTDOWN
========================================= */

function startCountdown(unlockAt){

  if(countdownInterval){

    clearInterval(countdownInterval);

  }


  const target =
    new Date(unlockAt).getTime();


  function updateCountdown(){

    const element =
      document.getElementById("countdown");


    if(!element){

      clearInterval(countdownInterval);

      return;

    }


    const now =
      Date.now();


    const difference =
      target - now;


    if(difference <= 0){

      clearInterval(countdownInterval);

      element.textContent =
        "Code unlocked!";

      /*
        Automatically check status again
        after unlock.
      */

      setTimeout(
        () => checkStatus(),
        800
      );

      return;

    }


    const totalSeconds =
      Math.floor(
        difference / 1000
      );


    const hours =
      Math.floor(
        totalSeconds / 3600
      );


    const minutes =
      Math.floor(
        (totalSeconds % 3600) / 60
      );


    const seconds =
      totalSeconds % 60;


    element.textContent =
      String(hours).padStart(2,"0") +
      ":" +
      String(minutes).padStart(2,"0") +
      ":" +
      String(seconds).padStart(2,"0");

  }


  updateCountdown();

  countdownInterval =
    setInterval(
      updateCountdown,
      1000
    );

}

</script>

</body>
</html>
