<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classic Empire Ltd — Exam</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080808;
  color:white;
  text-align:center;
}

.container{
  max-width:500px;
  margin:80px auto;
  padding:30px;
  background:#111;
  border:1px solid #444;
  border-radius:15px;
}

h1{
  color:#ffd700;
}

input,button{
  width:100%;
  padding:14px;
  margin-top:15px;
  border-radius:8px;
  box-sizing:border-box;
}

input{
  background:#222;
  color:white;
  border:1px solid #555;
}

button{
  background:#ffd700;
  color:#000;
  border:0;
  font-weight:bold;
  cursor:pointer;
}

#message{
  margin-top:20px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🏛️ Classic Empire Ltd</h1>

<h2>📝 Examination Portal</h2>

<p>Enter your Exam Access Code</p>

<input
  type="text"
  id="examCode"
  placeholder="Enter Exam Code"
>

<button onclick="checkCode()">Enter Exam</button>

<div id="message"></div>

</div>

<script>

function checkCode(){

  const code =
    document.getElementById("examCode").value
    .trim()
    .toUpperCase();

  /*
    Temporary test code.
    Later we will connect this
    with the real application system.
  */

  if(code === "CE-TEST-123456"){

    document.getElementById("message").innerHTML =
      "✅ Code verified! Exam access granted.";

  }else{

    document.getElementById("message").innerHTML =
      "❌ Invalid Exam Code.";

  }

}

</script>

</body>
</html>
