<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Classic Empire Ltd - Admin Panel</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#080808;
  color:#fff;
  min-height:100vh;
  padding:20px;
}

.container{
  max-width:1200px;
  margin:auto;
}

header{
  background:linear-gradient(135deg,#151515,#090909);
  border:1px solid #d4af37;
  border-radius:18px;
  padding:25px;
  text-align:center;
  margin-bottom:20px;
}

header h1{
  color:#d4af37;
  font-size:30px;
  margin-bottom:8px;
}

header p{
  color:#ccc;
}

.panel{
  background:#111;
  border:1px solid #333;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
}

.panel h2{
  color:#d4af37;
  margin-bottom:18px;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  margin:7px 0;
  border-radius:8px;
  border:1px solid #555;
  background:#181818;
  color:#fff;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#d4af37;
}

button{
  border:0;
  border-radius:8px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:bold;
  background:#d4af37;
  color:#000;
  margin:5px;
}

button:hover{
  opacity:.85;
}

.logout{
  background:#b00020;
  color:#fff;
}

.refresh{
  background:#333;
  color:#fff;
}

.hidden{
  display:none;
}

.message{
  padding:12px;
  border-radius:8px;
  margin:10px 0;
  background:#191919;
  border:1px solid #444;
}

.success{
  border-color:#00c853;
  color:#00e676;
}

.error{
  border-color:#ff1744;
  color:#ff5252;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
  min-width:900px;
}

th,
td{
  border:1px solid #333;
  padding:10px;
  text-align:left;
  vertical-align:top;
}

th{
  background:#1b1b1b;
  color:#d4af37;
}

td{
  background:#101010;
}

.table-wrap{
  overflow-x:auto;
}

.card{
  background:#0d0d0d;
  border:1px solid #333;
  border-radius:12px;
  padding:16px;
  margin:12px 0;
}

.card h3{
  color:#d4af37;
  margin-bottom:10px;
}

.small{
  color:#aaa;
  font-size:13px;
}

.answer-box{
  background:#171717;
  border-left:3px solid #d4af37;
  padding:12px;
  margin:8px 0;
  border-radius:5px;
  white-space:pre-wrap;
}

.result-controls{
  margin-top:15px;
  padding-top:15px;
  border-top:1px solid #333;
}

.result-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
}

.status-pass{
  color:#00e676;
  font-weight:bold;
}

.status-fail{
  color:#ff5252;
  font-weight:bold;
}

.status-pending{
  color:#ffd740;
  font-weight:bold;
}

footer{
  text-align:center;
  color:#777;
  padding:20px;
}

@media(max-width:600px){
  body{
    padding:10px;
  }

  header h1{
    font-size:23px;
  }

  .panel{
    padding:14px;
  }

  button{
    width:100%;
    margin:5px 0;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>🏛️ Classic Empire Ltd</h1>
  <p>Admin Control Panel</p>
</header>


<!-- LOGIN -->
<div id="loginPanel" class="panel">

  <h2>🔐 Admin Login</h2>

  <input
    type="email"
    id="loginEmail"
    placeholder="Admin Email"
  >

  <input
    type="password"
    id="loginPassword"
    placeholder="Password"
  >

  <button onclick="loginAdmin()">Login</button>

  <div id="loginMessage"></div>

</div>


<!-- ADMIN AREA -->
<div id="adminPanel" class="hidden">

  <div class="panel">

    <button class="logout" onclick="logoutAdmin()">
      🚪 Logout
    </button>

    <button class="refresh" onclick="loadAll()">
      🔄 Refresh All
    </button>

  </div>


  <!-- APPLICATIONS -->
  <div class="panel">

    <h2>📋 Applicant Applications</h2>

    <div id="applicationsMessage"></div>

    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>ID</th>
            <th>Applicant</th>
            <th>Age</th>
            <th>Class</th>
            <th>Post</th>
            <th>Email</th>
            <th>Contact</th>
            <th>Photo</th>
            <th>Reason</th>
            <th>Status</th>
            <th>Action</th>
          </tr>

        </thead>

        <tbody id="applicationsTable"></tbody>

      </table>

    </div>

  </div>


  <!-- EXAM CODE GENERATOR -->
  <div class="panel">

    <h2>🎟️ Exam Code Generator</h2>

    <input
      type="text"
      id="codeApplicantName"
      placeholder="Applicant Name"
    >

    <select id="codePost">

      <option value="">-- Post Select करें --</option>

      <option>President's Assistant</option>
      <option>DM</option>
      <option>DM's Assistant</option>
      <option>SDM</option>
      <option>SP</option>
      <option>DSP</option>

    </select>

    <button onclick="generateCode()">
      Generate Exam Code
    </button>

    <div id="codeMessage"></div>

  </div>


  <!-- CODE HISTORY -->
  <div class="panel">

    <h2>🎫 Exam Code History</h2>

    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>ID</th>
            <th>Code</th>
            <th>Applicant</th>
            <th>Post</th>
            <th>Used</th>
            <th>Created</th>
          </tr>

        </thead>

        <tbody id="codesTable"></tbody>

      </table>

    </div>

  </div>


  <!-- SUBMISSIONS -->
  <div class="panel">

    <h2>📝 Exam Submission History</h2>

    <div id="submissionMessage"></div>

    <div id="submissionsContainer"></div>

  </div>

</div>


<footer>
  Classic Empire Ltd © 2026
</footer>

</div>


<script>

const SUPABASE_URL =
"https://hjatspkzgoddcpgwfkxo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_nw9-8f_8dfZBN7M2q27Wrg_NXk6Eij_";


let accessToken = null;


function escapeHTML(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


async function supabaseRequest(
  endpoint,
  options={}
){

  const response = await fetch(
    SUPABASE_URL + endpoint,
    {
      ...options,

      headers:{
        "apikey":SUPABASE_KEY,

        "Authorization":
          "Bearer " +
          (accessToken || SUPABASE_KEY),

        "Content-Type":
          "application/json",

        ...(options.headers || {})
      }
    }
  );

  const text = await response.text();

  let data;

  try{
    data = text ? JSON.parse(text) : null;
  }catch{
    data = text;
  }

  if(!response.ok){

    throw new Error(
      data?.message ||
      data?.error_description ||
      data?.error ||
      text ||
      "Request failed"
    );

  }

  return data;
}


/* =========================
   LOGIN
========================= */

async function loginAdmin(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const message =
    document.getElementById("loginMessage");

  message.innerHTML = "";

  if(!email || !password){

    message.innerHTML =
      `<div class="message error">
        Email और Password भरें।
      </div>`;

    return;
  }


  try{

    const data = await supabaseRequest(
      "/auth/v1/token?grant_type=password",
      {
        method:"POST",
        headers:{
          "apikey":SUPABASE_KEY,
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          email:email,
          password:password
        })
      }
    );


    accessToken =
      data.access_token;


    const check =
      await supabaseRequest(
        "/rest/v1/rpc/check_admin",
        {
          method:"POST",
          body:"{}"
        }
      );


    if(
      !check ||
      check.is_admin !== true
    ){

      accessToken = null;

      throw new Error(
        "यह Account Admin नहीं है।"
      );

    }


    localStorage.setItem(
      "ce_admin_token",
      accessToken
    );


    document.getElementById(
      "loginPanel"
    ).classList.add("hidden");


    document.getElementById(
      "adminPanel"
    ).classList.remove("hidden");


    await loadAll();


  }catch(error){

    message.innerHTML =
      `<div class="message error">
        ❌ ${escapeHTML(error.message)}
      </div>`;

  }

}


/* =========================
   LOGOUT
========================= */

function logoutAdmin(){

  accessToken = null;

  localStorage.removeItem(
    "ce_admin_token"
  );

  location.reload();

}


/* =========================
   LOAD ALL
========================= */

async function loadAll(){

  await Promise.all([
    loadApplications(),
    loadCodes(),
    loadSubmissions()
  ]);

}


/* =========================
   APPLICATIONS
========================= */

async function loadApplications(){

  const table =
    document.getElementById(
      "applicationsTable"
    );

  const message =
    document.getElementById(
      "applicationsMessage"
    );

  table.innerHTML = "";

  try{

    const data =
      await supabaseRequest(
        "/rest/v1/rpc/get_applications",
        {
          method:"POST",
          body:"{}"
        }
      );


    if(!data || data.length === 0){

      table.innerHTML =
        `<tr>
          <td colspan="11">
            कोई application नहीं मिली।
          </td>
        </tr>`;

      return;
    }


    data.forEach(app => {

      const tr =
        document.createElement("tr");


      tr.innerHTML = `

        <td>${escapeHTML(app.id)}</td>

        <td>
          <strong>
            ${escapeHTML(app.applicant_name)}
          </strong>
        </td>

        <td>${escapeHTML(app.age)}</td>

        <td>${escapeHTML(app.class)}</td>

        <td>${escapeHTML(app.post)}</td>

        <td>${escapeHTML(app.applicant_email)}</td>

        <td>${escapeHTML(app.contact_number)}</td>

        <td>
          ${escapeHTML(app.applicant_photo)}
        </td>

        <td>
          ${escapeHTML(app.reason)}
        </td>

        <td>
          ${escapeHTML(app.status || "Pending")}
        </td>

        <td>

          <button
            onclick='useApplicationForCode(
              ${JSON.stringify(app.applicant_name)},
              ${JSON.stringify(app.post)}
            )'
          >
            🎟️ Generate Code
          </button>

        </td>

      `;

      table.appendChild(tr);

    });


  }catch(error){

    message.innerHTML =
      `<div class="message error">
        ❌ ${escapeHTML(error.message)}
      </div>`;

  }

}


/* =========================
   USE APPLICATION
========================= */

function useApplicationForCode(
  applicantName,
  post
){

  document.getElementById(
    "codeApplicantName"
  ).value = applicantName;


  document.getElementById(
    "codePost"
  ).value = post;


  document.getElementById(
    "codeApplicantName"
  ).scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

}


/* =========================
   GENERATE CODE
========================= */

async function generateCode(){

  const name =
    document.getElementById(
      "codeApplicantName"
    ).value.trim();


  const post =
    document.getElementById(
      "codePost"
    ).value;


  const message =
    document.getElementById(
      "codeMessage"
    );


  message.innerHTML = "";


  if(!name || !post){

    message.innerHTML =
      `<div class="message error">
        Applicant Name और Post भरें।
      </div>`;

    return;

  }


  try{

    const result =
      await supabaseRequest(
        "/rest/v1/rpc/generate_exam_code",
        {
          method:"POST",
          body:JSON.stringify({
            input_applicant_name:name,
            input_post:post
          })
        }
      );


    message.innerHTML =
      `<div class="message success">
        ✅ Exam Code Generated:
        <strong>
          ${escapeHTML(result)}
        </strong>
      </div>`;


    await loadCodes();


  }catch(error){

    message.innerHTML =
      `<div class="message error">
        ❌ ${escapeHTML(error.message)}
      </div>`;

  }

}


/* =========================
   CODE HISTORY
========================= */

async function loadCodes(){

  const table =
    document.getElementById(
      "codesTable"
    );

  table.innerHTML = "";

  try{

    const data =
      await supabaseRequest(
        "/rest/v1/rpc/get_exam_codes",
        {
          method:"POST",
          body:"{}"
        }
      );


    if(!data || data.length === 0){

      table.innerHTML =
        `<tr>
          <td colspan="6">
            कोई Exam Code नहीं है।
          </td>
        </tr>`;

      return;

    }


    data.forEach(code => {

      const tr =
        document.createElement("tr");


      tr.innerHTML = `

        <td>${escapeHTML(code.id)}</td>

        <td>
          <strong>
            ${escapeHTML(code.code)}
          </strong>
        </td>

        <td>
          ${escapeHTML(code.applicant_name)}
        </td>

        <td>
          ${escapeHTML(code.post)}
        </td>

        <td>
          ${
            code.used
            ? '<span class="status-fail">Used</span>'
            : '<span class="status-pass">Unused</span>'
          }
        </td>

        <td>
          ${escapeHTML(
            new Date(code.created_at)
            .toLocaleString("en-IN")
          )}
        </td>

      `;

      table.appendChild(tr);

    });


  }catch(error){

    table.innerHTML =
      `<tr>
        <td colspan="6">
          ❌ ${escapeHTML(error.message)}
        </td>
      </tr>`;

  }

}


/* =========================
   SUBMISSIONS
========================= */

async function loadSubmissions(){

  const container =
    document.getElementById(
      "submissionsContainer"
    );

  const message =
    document.getElementById(
      "submissionMessage"
    );

  container.innerHTML = "";

  try{

    const data =
      await supabaseRequest(
        "/rest/v1/rpc/get_exam_submissions",
        {
          method:"POST",
          body:"{}"
        }
      );


    if(!data || data.length === 0){

      container.innerHTML =
        `<div class="message">
          अभी कोई Exam Submission नहीं है।
        </div>`;

      return;

    }


    data.forEach(sub => {

      const card =
        document.createElement("div");

      card.className = "card";


      const result =
        sub.final_result || "Pending";


      let resultClass =
        "status-pending";


      if(
        String(result).toLowerCase()
        .includes("pass")
      ){

        resultClass =
          "status-pass";

      }


      if(
        String(result).toLowerCase()
        .includes("fail")
      ){

        resultClass =
          "status-fail";

      }


      card.innerHTML = `

        <h3>
          👤 ${escapeHTML(sub.applicant_name)}
        </h3>

        <p class="small">
          Submission ID:
          ${escapeHTML(sub.id)}
        </p>

        <p>
          <strong>Post:</strong>
          ${escapeHTML(sub.post)}
        </p>

        <p>
          <strong>Exam Code:</strong>
          ${escapeHTML(sub.exam_code)}
        </p>

        <p>
          <strong>Objective Score:</strong>
          ${escapeHTML(sub.objective_score)}
          / 18
        </p>


        <h4 style="margin-top:15px;color:#d4af37;">
          📖 Subjective Answer 1
        </h4>

        <div class="answer-box">
          ${escapeHTML(
            sub.subjective_answer_1
          )}
        </div>


        <h4 style="margin-top:15px;color:#d4af37;">
          📖 Subjective Answer 2
        </h4>

        <div class="answer-box">
          ${escapeHTML(
            sub.subjective_answer_2
          )}
        </div>


        <div class="result-controls">

          <h4 style="color:#d4af37;">
            🧑‍⚖️ Admin Checking
          </h4>

          <div class="result-grid">

            <div>
              <label>
                Subjective Marks
              </label>

              <input
                type="number"
                min="0"
                max="10"
                id="subjective_${sub.id}"
                value="${escapeHTML(
                  sub.subjective_marks ?? 0
                )}"
              >

            </div>


            <div>
              <label>
                Total Marks
              </label>

              <input
                type="number"
                min="0"
                id="total_${sub.id}"
                value="${escapeHTML(
                  sub.total_marks ?? sub.objective_score
                )}"
              >

            </div>


            <div>
              <label>
                Final Result
              </label>

              <select id="result_${sub.id}">

                <option
                  value="Pending"
                  ${result === "Pending" ? "selected" : ""}
                >
                  Pending
                </option>

                <option
                  value="Pass"
                  ${result === "Pass" ? "selected" : ""}
                >
                  Pass
                </option>

                <option
                  value="Fail"
                  ${result === "Fail" ? "selected" : ""}
                >
                  Fail
                </option>

              </select>

            </div>

          </div>


          <button
            onclick="saveResult(${sub.id})"
          >
            💾 Save Final Result
          </button>


          <p style="margin-top:10px;">
            Current Result:
            <span class="${resultClass}">
              ${escapeHTML(result)}
            </span>
          </p>

        </div>

      `;


      container.appendChild(card);

    });


  }catch(error){

    message.innerHTML =
      `<div class="message error">
        ❌ ${escapeHTML(error.message)}
      </div>`;

  }

}


/* =========================
   SAVE RESULT
========================= */

async function saveResult(id){

  const subjective =
    Number(
      document.getElementById(
        `subjective_${id}`
      ).value
    );


  const total =
    Number(
      document.getElementById(
        `total_${id}`
      ).value
    );


  const result =
    document.getElementById(
      `result_${id}`
    ).value;


  if(
    Number.isNaN(subjective) ||
    Number.isNaN(total)
  ){

    alert("Marks सही भरें।");
    return;

  }


  try{

    const data =
      await supabaseRequest(
        "/rest/v1/rpc/update_exam_result",
        {
          method:"POST",
          body:JSON.stringify({
            input_submission_id:id,
            input_subjective_marks:subjective,
            input_total_marks:total,
            input_final_result:result
          })
        }
      );


    if(!data || data.success !== true){

      throw new Error(
        data?.message ||
        "Result update नहीं हुआ"
      );

    }


    alert(
      "✅ Final Result Successfully Updated"
    );


    await loadSubmissions();


  }catch(error){

    alert(
      "❌ " + error.message
    );

  }

}


/* =========================
   AUTO LOGIN FROM TOKEN
========================= */

async function restoreSession(){

  const savedToken =
    localStorage.getItem(
      "ce_admin_token"
    );


  if(!savedToken){
    return;
  }


  accessToken =
    savedToken;


  try{

    const check =
      await supabaseRequest(
        "/rest/v1/rpc/check_admin",
        {
          method:"POST",
          body:"{}"
        }
      );


    if(
      check &&
      check.is_admin === true
    ){

      document.getElementById(
        "loginPanel"
      ).classList.add("hidden");


      document.getElementById(
        "adminPanel"
      ).classList.remove("hidden");


      await loadAll();

    }else{

      logoutAdmin();

    }


  }catch(error){

    logoutAdmin();

  }

}


restoreSession();

</script>

</body>
</html>
