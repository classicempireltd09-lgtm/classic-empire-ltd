<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Classic Empire Ltd - Application Status</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#080808;
  color:#fff;
  min-height:100vh;
  padding:20px;
}

.container{
  max-width:700px;
  margin:auto;
}

.header{
  text-align:center;
  margin-bottom:25px;
}

.header h1{
  color:#ffd700;
  font-size:30px;
  margin-bottom:8px;
}

.header p{
  color:#aaa;
}

.card{
  background:#111;
  border:1px solid #333;
  border-radius:15px;
  padding:25px;
  margin-bottom:20px;
  box-shadow:0 0 20px rgba(255,215,0,.08);
}

label{
  display:block;
  margin-bottom:8px;
  color:#ffd700;
  font-weight:bold;
}

input{
  width:100%;
  padding:14px;
  border-radius:8px;
  border:1px solid #444;
  background:#181818;
  color:#fff;
  font-size:16px;
  margin-bottom:15px;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:8px;
  background:#ffd700;
  color:#000;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#ffea70;
}

.result{
  display:none;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:13px 0;
  border-bottom:1px solid #292929;
}

.row:last-child{
  border-bottom:none;
}

.key{
  color:#aaa;
}

.value{
  text-align:right;
  font-weight:bold;
}

.status{
  display:inline-block;
  padding:7px 12px;
  border-radius:20px;
}

.pending{
  background:#6b5200;
  color:#ffe477;
}

.approved{
  background:#064d28;
  color:#6cffae;
}

.rejected{
  background:#5b1010;
  color:#ff8d8d;
}

.code{
  color:#ffd700;
  font-size:24px;
  letter-spacing:2px;
}

.message{
  text-align:center;
  padding:15px;
  margin-top:15px;
  border-radius:8px;
  display:none;
}

.error{
  background:#4b1111;
  color:#ff9a9a;
}

.info{
  background:#171717;
  color:#ccc;
}

.exam-btn{
  margin-top:20px;
  background:#00d084;
  color:#000;
}

.exam-btn:hover{
  background:#4cffad;
}

.back{
  display:block;
  text-align:center;
  color:#ffd700;
  text-decoration:none;
  margin-top:20px;
}

.back:hover{
  text-decoration:underline;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🏛️ Classic Empire Ltd</h1>
    <p>Application Status</p>
  </div>

  <div class="card">

    <label for="email">Applicant Email</label>

    <input
      type="email"
      id="email"
      placeholder="अपना application email डालें"
      autocomplete="email"
    >

    <button onclick="checkStatus()">
      📋 Check Application Status
    </button>

    <div id="message" class="message"></div>

  </div>

  <div id="result" class="card result">

    <div class="row">
      <span class="key">Applicant Name</span>
      <span class="value" id="applicantName">-</span>
    </div>

    <div class="row">
      <span class="key">Applied Post</span>
      <span class="value" id="post">-</span>
    </div>

    <div class="row">
      <span class="key">Application Status</span>
      <span class="value">
        <span id="status" class="status">-</span>
      </span>
    </div>

    <div id="codeRow" class="row" style="display:none;">
      <span class="key">Exam Code</span>
      <span class="value code" id="examCode">-</span>
    </div>

    <button
      id="examButton"
      class="exam-btn"
      style="display:none;"
      onclick="openExam()"
    >
      📝 Open Exam Portal
    </button>

    <div
      id="infoBox"
      class="message info"
      style="display:block;"
    ></div>

  </div>

  <a class="back" href="index.html">
    ← Back to Classic Empire Ltd
  </a>

</div>

<script>

const SUPABASE_URL =
"https://hjatspkzgoddcpgwfkxo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_nw9-8f_8dfZBN7M2q27Wrg_NXk6Eij_";

let currentExamCode = "";

function showMessage(text,type){

  const box = document.getElementById("message");

  box.textContent = text;
  box.className = "message " + type;
  box.style.display = "block";
}

function hideMessage(){

  document.getElementById("message").style.display = "none";

}

async function checkStatus(){

  hideMessage();

  const email =
    document.getElementById("email").value.trim();

  if(!email){

    showMessage(
      "कृपया Applicant Email डालें।",
      "error"
    );

    return;
  }

  const button =
    document.querySelector("button");

  button.disabled = true;
  button.textContent = "Checking...";

  document.getElementById("result").style.display = "none";

  try{

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/rpc/get_application_status",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json",
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY
        },

        body:JSON.stringify({
          input_applicant_email:email
        })
      }
    );

    const data = await response.json();

    if(!response.ok){

      throw new Error(
        data.message ||
        "Status check failed"
      );

    }

    if(!data.success){

      showMessage(
        data.message || "Application नहीं मिली।",
        "error"
      );

      return;
    }

    document.getElementById(
      "result"
    ).style.display = "block";

    document.getElementById(
      "applicantName"
    ).textContent =
      data.applicant_name || "-";

    document.getElementById(
      "post"
    ).textContent =
      data.post || "-";

    const status =
      document.getElementById("status");

    status.textContent =
      data.status || "Pending";

    status.className =
      "status " +
      (
        data.status === "Approved"
        ? "approved"
        : data.status === "Rejected"
        ? "rejected"
        : "pending"
      );

    const codeRow =
      document.getElementById("codeRow");

    const code =
      document.getElementById("examCode");

    const examButton =
      document.getElementById("examButton");

    const info =
      document.getElementById("infoBox");

    codeRow.style.display = "none";
    examButton.style.display = "none";

    currentExamCode = "";

    if(data.status === "Pending"){

      info.textContent =
        "⏳ आपका application अभी Admin review में है।";

    }

    else if(data.status === "Rejected"){

      info.textContent =
        "❌ आपका application Reject किया गया है।";

    }

    else if(data.status === "Approved"){

      if(data.exam_code){

        currentExamCode =
          data.exam_code;

        code.textContent =
          data.exam_code;

        codeRow.style.display =
          "flex";

        if(data.code_used){

          info.textContent =
            "⚠️ यह Exam Code पहले ही इस्तेमाल हो चुका है।";

        }else{

          info.textContent =
            "✅ आपका application Approved है। नीचे दिए Exam Code से परीक्षा दे सकते हैं।";

          examButton.style.display =
            "block";
        }

      }else{

        info.textContent =
          "✅ Application Approved है, लेकिन Exam Code अभी Admin ने generate नहीं किया है।";

      }

    }

  }catch(error){

    console.error(error);

    showMessage(
      "Status check करते समय समस्या हुई।",
      "error"
    );

  }finally{

    button.disabled = false;
    button.textContent =
      "📋 Check Application Status";

  }

}

function openExam(){

  if(!currentExamCode){

    return;
  }

  window.location.href =
    "exam.html";

}

document.getElementById("email")
.addEventListener("keydown",function(event){

  if(event.key === "Enter"){

    checkStatus();

  }

});

</script>

</body>
</html>
