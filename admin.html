<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Classic Empire Ltd - Admin Panel</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#080808;
  color:#fff;
  min-height:100vh;
}

.container{
  width:100%;
  max-width:500px;
  margin:auto;
  padding:25px 18px;
}

.header{
  text-align:center;
  padding:35px 10px 20px;
}

.header h1{
  color:#d4af37;
  font-size:32px;
}

.header p{
  color:#999;
  margin-top:8px;
}

.panel{
  background:#111;
  border:1px solid #333;
  border-radius:15px;
  padding:25px;
  margin-top:20px;
}

.panel h2{
  text-align:center;
  color:#d4af37;
  margin-bottom:20px;
}

label{
  display:block;
  color:#d4af37;
  font-weight:bold;
  margin:14px 0 6px;
}

input,
select{
  width:100%;
  padding:13px;
  background:#1b1b1b;
  border:1px solid #555;
  border-radius:8px;
  color:#fff;
  font-size:15px;
}

button{
  width:100%;
  padding:13px;
  margin-top:18px;
  border:0;
  border-radius:8px;
  background:#d4af37;
  color:#000;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  background:#fff;
}

.logout{
  background:#333;
  color:#fff;
}

.message{
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  text-align:center;
  display:none;
}

.error{
  background:#3a1111;
  border:1px solid #a33;
  color:#ff9999;
}

.success{
  background:#113a1d;
  border:1px solid #3a9;
  color:#9f9;
}

#generatorPanel{
  display:none;
}

.code-box{
  margin-top:20px;
  background:#050505;
  border:2px solid #d4af37;
  border-radius:10px;
  padding:20px;
  text-align:center;
}

.code-label{
  color:#aaa;
  font-size:14px;
}

.exam-code{
  color:#d4af37;
  font-size:27px;
  font-weight:bold;
  letter-spacing:2px;
  margin-top:8px;
  word-break:break-all;
}

.back{
  display:block;
  text-align:center;
  margin-top:25px;
  color:#d4af37;
  text-decoration:none;
  font-weight:bold;
}

.back:hover{
  color:#fff;
}

.footer{
  text-align:center;
  color:#666;
  margin-top:35px;
  padding-bottom:25px;
  font-size:13px;
}

</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Classic Empire Ltd</h1>
    <p>🔐 Official Admin Panel</p>
  </div>


  <!-- ADMIN LOGIN -->

  <div class="panel" id="loginPanel">

    <h2>Admin Login</h2>

    <label>Email</label>

    <input
      type="email"
      id="email"
      placeholder="Admin Email"
      autocomplete="email"
    >

    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Admin Password"
      autocomplete="current-password"
    >

    <button onclick="adminLogin()">
      🔐 Login
    </button>

    <div
      id="loginMessage"
      class="message"
    ></div>

  </div>


  <!-- EXAM CODE GENERATOR -->

  <div class="panel" id="generatorPanel">

    <h2>Exam Code Generator</h2>

    <label>Applicant Name</label>

    <input
      type="text"
      id="applicantName"
      placeholder="Applicant का नाम"
    >

    <label>Post</label>

    <select id="post">

      <option value="">
        -- Post चुनें --
      </option>

      <option value="President's Assistant">
        President's Assistant
      </option>

      <option value="DM">
        DM
      </option>

      <option value="DM's Assistant">
        DM's Assistant
      </option>

      <option value="SDM">
        SDM
      </option>

      <option value="SP">
        SP
      </option>

      <option value="DSP">
        DSP
      </option>

    </select>

    <button onclick="generateCode()">
      Generate Exam Code
    </button>

    <div
      id="generatorMessage"
      class="message"
    ></div>

    <div
      class="code-box"
      id="codeBox"
      style="display:none;"
    >

      <div class="code-label">
        Generated Exam Code
      </div>

      <div
        class="exam-code"
        id="generatedCode"
      ></div>

      <button onclick="copyCode()">
        📋 Copy Exam Code
      </button>

    </div>

    <button
      class="logout"
      onclick="logout()"
    >
      Logout
    </button>

  </div>


  <a
    href="index.html"
    class="back"
  >
    ← Back to Home
  </a>


  <div class="footer">
    © 2026 Classic Empire Ltd
  </div>

</div>


<!-- SUPABASE JS -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://hjatspkzgoddcpgwfkxo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_nw9-8f_8dfZBN7M2q27Wrg_NXk6Eij_";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   ADMIN UID
========================= */

const ADMIN_UID =
"8820968d-c20b-4892-b38b-395083efd026";


/* =========================
   ADMIN LOGIN
========================= */

async function adminLogin(){

  const email =
    document.getElementById("email")
    .value.trim();

  const password =
    document.getElementById("password")
    .value;

  const message =
    document.getElementById("loginMessage");

  if(!email || !password){

    showMessage(
      message,
      "Email और Password दोनों डालें",
      "error"
    );

    return;
  }

  try{

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if(error){

      showMessage(
        message,
        "गलत Email या Password",
        "error"
      );

      return;
    }

    if(!data.user){

      showMessage(
        message,
        "Login सफल नहीं हुआ",
        "error"
      );

      return;
    }


    /* ADMIN UID CHECK */

    if(data.user.id !== ADMIN_UID){

      await supabaseClient.auth.signOut();

      showMessage(
        message,
        "यह Account Admin नहीं है",
        "error"
      );

      return;
    }


    /* DATABASE ADMIN CHECK */

    const { data: adminData, error: adminError } =
      await supabaseClient.rpc("check_admin");

    if(adminError){

      await supabaseClient.auth.signOut();

      showMessage(
        message,
        "Admin verification में समस्या हुई",
        "error"
      );

      return;
    }


    if(
      !adminData ||
      adminData.is_admin !== true
    ){

      await supabaseClient.auth.signOut();

      showMessage(
        message,
        "आपके Account को Admin permission नहीं है",
        "error"
      );

      return;
    }


    /* SUCCESS */

    document.getElementById(
      "loginPanel"
    ).style.display = "none";

    document.getElementById(
      "generatorPanel"
    ).style.display = "block";


  }catch(error){

    showMessage(
      message,
      "Login में समस्या हुई।",
      "error"
    );

  }

}


/* =========================
   GENERATE EXAM CODE
========================= */

async function generateCode(){

  const name =
    document.getElementById("applicantName")
    .value.trim();

  const post =
    document.getElementById("post").value;

  const message =
    document.getElementById("generatorMessage");

  const codeBox =
    document.getElementById("codeBox");

  const generatedCode =
    document.getElementById("generatedCode");


  if(!name){

    showMessage(
      message,
      "Applicant का नाम डालें",
      "error"
    );

    return;
  }


  if(!post){

    showMessage(
      message,
      "Post चुनें",
      "error"
    );

    return;
  }


  try{

    const {
      data: sessionData,
      error: sessionError
    } =
      await supabaseClient.auth.getSession();


    if(sessionError || !sessionData.session){

      showMessage(
        message,
        "Admin Login समाप्त हो गया। दोबारा Login करें।",
        "error"
      );

      return;
    }


    /* ADMIN CHECK AGAIN */

    const { data: adminData, error: adminError } =
      await supabaseClient.rpc("check_admin");


    if(
      adminError ||
      !adminData ||
      adminData.is_admin !== true
    ){

      showMessage(
        message,
        "Admin permission नहीं है।",
        "error"
      );

      return;
    }


    /* GENERATE CODE */

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "generate_exam_code",
        {
          input_applicant_name:name,
          input_post:post
        }
      );


    if(error){

      console.error(error);

      showMessage(
        message,
        "Exam Code generate नहीं हुआ।",
        "error"
      );

      return;
    }


    generatedCode.textContent = data;

    codeBox.style.display = "block";


    showMessage(
      message,
      "Exam Code successfully generate हो गया।",
      "success"
    );


  }catch(error){

    console.error(error);

    showMessage(
      message,
      "Supabase connection में समस्या हुई।",
      "error"
    );

  }

}


/* =========================
   COPY CODE
========================= */

async function copyCode(){

  const code =
    document.getElementById(
      "generatedCode"
    ).textContent;

  try{

    await navigator.clipboard.writeText(code);

    alert("Exam Code copied!");

  }catch(error){

    alert("Code copy नहीं हुआ।");
  }

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await supabaseClient.auth.signOut();

  document.getElementById(
    "generatorPanel"
  ).style.display = "none";

  document.getElementById(
    "loginPanel"
  ).style.display = "block";

  document.getElementById("email").value = "";
  document.getElementById("password").value = "";

}


/* =========================
   MESSAGE
========================= */

function showMessage(
  element,
  text,
  type
){

  element.textContent = text;

  element.className =
    "message " + type;

  element.style.display =
    "block";

}


/* =========================
   CHECK EXISTING SESSION
========================= */

async function checkExistingSession(){

  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();


    if(error || !data.session){

      return;
    }


    const user =
      data.session.user;


    if(user.id !== ADMIN_UID){

      await supabaseClient.auth.signOut();

      return;
    }


    const {
      data:adminData,
      error:adminError
    } =
      await supabaseClient.rpc("check_admin");


    if(
      !adminError &&
      adminData &&
      adminData.is_admin === true
    ){

      document.getElementById(
        "loginPanel"
      ).style.display = "none";

      document.getElementById(
        "generatorPanel"
      ).style.display = "block";

    }else{

      await supabaseClient.auth.signOut();

    }

  }catch(error){

    console.error(error);

  }

}


/* =========================
   PAGE LOAD
========================= */

window.addEventListener(
  "load",
  checkExistingSession
);

</script>

</body>
</html>
