/* ==============================
   GLOBAL VARIABLES
================================ */

let verifiedCode = "";
let verifiedPost = "";
let verifiedApplicantName = "";
let examSubmitted = false;


/* ==============================
   START EXAM
================================ */

async function startExam(){

const name =
document.getElementById("candidateName").value.trim();

const code =
document.getElementById("examCode").value.trim().toUpperCase();

const post =
document.getElementById("postSelect").value;

const message =
document.getElementById("loginMessage");

const button =
document.getElementById("startButton");


message.textContent = "";


if(name===""){

message.style.color="#ff6464";
message.textContent="कृपया उम्मीदवार का नाम दर्ज करें।";

return;

}


if(code===""){

message.style.color="#ff6464";
message.textContent="कृपया Exam Code दर्ज करें।";

return;

}


if(post===""){

message.style.color="#ff6464";
message.textContent="कृपया Examination Post चुनें।";

return;

}


button.disabled=true;

button.textContent="Code जाँच हो रही है...";


try{

const response = await fetch(
SUPABASE_URL + "/rest/v1/rpc/verify_exam_code",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY,
"Authorization":"Bearer " + SUPABASE_KEY
},

body:JSON.stringify({
input_code:code,
input_post:post
})

});


const data = await response.json();


if(!response.ok){

throw new Error(
data.message || "Supabase verification failed"
);

}


if(!data.success){

message.style.color="#ff6464";

message.textContent =
data.message ||
"गलत, अमान्य या पहले इस्तेमाल किया गया Exam Code";

button.disabled=false;
button.textContent="Start Examination";

return;

}


/*
  Database में दर्ज applicant name
  को सुरक्षित रूप से इस्तेमाल किया जा रहा है।
*/

verifiedCode = code;
verifiedPost = post;
verifiedApplicantName =
data.applicant_name || name;


/*
  Candidate द्वारा डाला गया नाम
  database वाले नाम से मिलना चाहिए।
*/

if(
name.trim().toLowerCase() !==
verifiedApplicantName.trim().toLowerCase()
){

message.style.color="#ff6464";

message.textContent =
"Candidate Name और Exam Code के नाम में मिलान नहीं है।";

button.disabled=false;
button.textContent="Start Examination";

return;

}


document.getElementById("loginBox").style.display="none";

document.getElementById("examArea").style.display="block";

document.getElementById("showName").textContent=
verifiedApplicantName;

document.getElementById("showPost").textContent=
verifiedPost;

loadQuestions(verifiedPost);

window.scrollTo(0,0);


}catch(error){

console.error(error);

message.style.color="#ff6464";

message.textContent =
"Exam Code जाँचने में समस्या हुई। कृपया बाद में फिर प्रयास करें।";

button.disabled=false;
button.textContent="Start Examination";

}

}


/* ==============================
   LOAD QUESTIONS
================================ */

function loadQuestions(post){

const area =
document.getElementById("questions");

area.innerHTML="";

const paper =
examData[post];


paper.forEach((item,index)=>{

let html="";

html+=`
<div class="question">

<div class="question-number">
प्रश्न ${index+1}
</div>

<div class="type">
${item.type==="MCQ" ? "बहुविकल्पीय प्रश्न" :
  item.type==="TRUE" ? "सही / गलत" :
  "वर्णनात्मक प्रश्न"}
</div>

<p>
${escapeHTML(item.question)}
</p>
`;


if(item.type==="SUBJECTIVE"){

html+=`

<textarea
id="subjective${index}"
placeholder="अपना उत्तर यहाँ लिखें..."
></textarea>

`;

}else{

item.options.forEach((option,optIndex)=>{

const letter =
String.fromCharCode(65+optIndex);

html+=`

<label class="option">

<input
type="radio"
name="q${index}"
value="${optIndex}"
>

${letter}. ${escapeHTML(option)}

</label>

`;

});

}

html+=`
</div>
`;

area.innerHTML += html;

});

}


/* ==============================
   SUBMIT EXAM
================================ */

async function submitExam(){

if(examSubmitted){
return;
}


const post =
document.getElementById("showPost").textContent;

const paper =
examData[post];

let score=0;

let unanswered=0;

let subjective=0;


paper.forEach((item,index)=>{

if(item.type==="SUBJECTIVE"){

subjective++;

return;

}


const selected =
document.querySelector(
'input[name="q'+index+'"]:checked'
);


if(!selected){

unanswered++;

return;

}


if(
Number(selected.value) ===
item.answer
){

score++;

}

});


const totalObjective =
paper.length - subjective;

const percentage =
Math.round(
(score / totalObjective) * 100
);

const passed =
percentage >= 60;


/*
  पहले Supabase में code को
  used करने की कोशिश होगी।
*/

const submitButton =
document.getElementById("submitButton");

submitButton.disabled=true;

submitButton.textContent=
"Exam जमा हो रहा है...";


try{

const response = await fetch(
SUPABASE_URL + "/rest/v1/rpc/submit_exam_code",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY,
"Authorization":"Bearer " + SUPABASE_KEY
},

body:JSON.stringify({
input_code:verifiedCode
})

});


const data =
await response.json();


if(!response.ok || !data.success){

throw new Error(
data.message ||
"Exam submission failed"
);

}


examSubmitted=true;


/*
  Code successfully used होने के बाद
  result दिखाया जाएगा।
*/

document.getElementById("examArea").style.display="none";

document.getElementById("result").style.display="block";


const resultText =
document.getElementById("resultText");

const scoreText =
document.getElementById("scoreText");


if(passed){

resultText.className="pass";

resultText.textContent=
"PASS — Objective Section";

}else{

resultText.className="fail";

resultText.textContent=
"FAIL — Objective Section";

}


scoreText.innerHTML=`

<p style="text-align:center;font-size:20px;">

<strong>Objective Score:</strong>
${score} / ${totalObjective}

<br>

<strong>Percentage:</strong>
${percentage}%

<br>

<strong>Unanswered:</strong>
${unanswered}

<br>

<strong>Subjective Questions:</strong>
${subjective}

</p>

<hr>

<p style="text-align:center;color:#aaa;">

उत्तीर्ण सीमा:
स्वचालित Objective Section में 60%।

</p>

`;

window.scrollTo(0,0);


}catch(error){

console.error(error);

submitButton.disabled=false;

submitButton.textContent=
"Submit Examination";

alert(
"Exam जमा नहीं हुआ। आपका Exam Code अभी इस्तेमाल नहीं हुआ है। कृपया फिर से Submit करें।"
);

}

}


/* ==============================
   HTML SECURITY
================================ */

function escapeHTML(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}
