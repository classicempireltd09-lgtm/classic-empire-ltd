<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Classic Empire — Attendance Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
    }

    header {
      background: #111;
      border-bottom: 1px solid #333;
      text-align: center;
      padding: 20px;
    }

    header img {
      width: 82px;
      height: 82px;
      object-fit: contain;
    }

    header h1 {
      color: #ffd700;
      margin: 8px 0;
      font-size: 25px;
    }

    header p {
      color: #aaa;
      margin: 5px;
    }

    .container {
      width: 94%;
      max-width: 1100px;
      margin: 25px auto;
    }

    .login-card,
    .card {
      background: #111;
      border: 1px solid #333;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .login-card {
      max-width: 500px;
      margin: 30px auto;
    }

    .login-card h2,
    .card h2 {
      color: #ffd700;
      text-align: center;
      margin-top: 0;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      color: #ccc;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #555;
      background: #080808;
      color: white;
      font-size: 15px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #ffd700;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button.secondary {
      background: #222;
      color: #ffd700;
      border: 1px solid #ffd700;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stats {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: #111;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 18px;
      text-align: center;
    }

    .stat h3 {
      color: #ffd700;
      margin: 0 0 10px;
      font-size: 16px;
    }

    .stat strong {
      font-size: 30px;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .controls input {
      flex: 1;
      min-width: 200px;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 720px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px 10px;
      border-bottom: 1px solid #333;
      text-align: left;
    }

    th {
      color: #ffd700;
      background: #171717;
    }

    .present {
      color: #42e65b;
      font-weight: bold;
    }

    .absent {
      color: #ff5555;
      font-weight: bold;
    }

    .message {
      padding: 13px;
      border-radius: 9px;
      margin-bottom: 18px;
      text-align: center;
      display: none;
    }

    .success {
      display: block;
      background: #123b1c;
      border: 1px solid #36d35b;
    }

    .error {
      display: block;
      background: #351212;
      border: 1px solid #ff4444;
    }

    .info {
      display: block;
      background: #171717;
      border: 1px solid #555;
    }

    #dashboard {
      display: none;
    }

    #loginSection {
      display: none;
    }

    .user-info {
      color: #bbb;
      text-align: center;
      margin-bottom: 15px;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 30px 10px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>

  <img
    src="classic-empire-logo.png"
    alt="Classic Empire Logo"
  >

  <h1>Classic Empire Ltd.</h1>

  <p>QR Attendance Dashboard</p>

</header>

<div class="container">

  <!-- =========================
       LOGIN
  ========================== -->

  <section id="loginSection" class="login-card">

    <h2>🔐 Attendance Login</h2>

    <div id="loginMessage" class="message"></div>

    <div class="field">

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Email दर्ज करें"
        autocomplete="email"
      >

    </div>

    <div class="field">

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Password दर्ज करें"
        autocomplete="current-password"
      >

    </div>

    <button onclick="login()">
      Login
    </button>

  </section>


  <!-- =========================
       DASHBOARD
  ========================== -->

  <section id="dashboard">

    <div id="mainMessage" class="message"></div>

    <div class="card">

      <div class="user-info">
        Logged in user:
        <strong id="userEmail"></strong>
      </div>

      <div class="buttons" style="justify-content:center;">

        <button onclick="loadAttendance()">
          🔄 Refresh
        </button>

        <button
          class="secondary"
          onclick="logout()"
        >
          Logout
        </button>

      </div>

    </div>


    <!-- =========================
         STATISTICS
    ========================== -->

    <div class="stats">

      <div class="stat">
        <h3>कुल Records</h3>
        <strong id="totalRecords">0</strong>
      </div>

      <div class="stat">
        <h3>Present</h3>
        <strong id="presentCount">0</strong>
      </div>

      <div class="stat">
        <h3>कुल Members</h3>
        <strong id="memberCount">0</strong>
      </div>

    </div>


    <!-- =========================
         ATTENDANCE TABLE
    ========================== -->

    <div class="card">

      <h2>📋 Attendance History</h2>

      <div class="controls">

        <input
          type="text"
          id="search"
          placeholder="Member का नाम खोजें..."
          oninput="filterTable()"
        >

        <button onclick="loadAttendance()">
          🔄 Refresh
        </button>

      </div>

      <div class="table-wrapper">

        <table>

          <thead>

            <tr>
              <th>ID</th>
              <th>Member ID</th>
              <th>Member Name</th>
              <th>Date</th>
              <th>Time</th>
              <th>Status</th>
            </tr>

          </thead>

          <tbody id="attendanceBody">

            <tr>
              <td colspan="6">
                Loading...
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </section>

</div>


<footer>
  Classic Empire Ltd • Chakla Ghat, Kishanganj, Bihar, India
</footer>


<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
  "https://hjatspkzgoddcpgwfkxo.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_nw9-8f_8dfZBN7M2q27Wrg_NXk6Eij_";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================
   DATA
===================================== */

let attendanceData = [];


/* =====================================
   PAGE START
===================================== */

window.addEventListener(
  "load",
  checkLogin
);


/* =====================================
   CHECK LOGIN
===================================== */

async function checkLogin() {

  const {
    data,
    error
  } =
    await supabaseClient.auth.getSession();

  if (error) {

    showLoginMessage(
      "❌ Login status check नहीं हो पाया।",
      false
    );

    showLogin();

    return;
  }

  if (data.session) {

    const email =
      data.session.user.email || "";

    document.getElementById(
      "userEmail"
    ).textContent = email;

    showDashboard();

    await loadAttendance();

  } else {

    showLogin();

  }
}


/* =====================================
   SHOW LOGIN
===================================== */

function showLogin() {

  document.getElementById(
    "loginSection"
  ).style.display = "block";

  document.getElementById(
    "dashboard"
  ).style.display = "none";
}


/* =====================================
   SHOW DASHBOARD
===================================== */

function showDashboard() {

  document.getElementById(
    "loginSection"
  ).style.display = "none";

  document.getElementById(
    "dashboard"
  ).style.display = "block";
}


/* =====================================
   LOGIN
===================================== */

async function login() {

  const email =
    document.getElementById(
      "email"
    ).value.trim();

  const password =
    document.getElementById(
      "password"
    ).value;

  if (!email || !password) {

    showLoginMessage(
      "कृपया Email और Password दोनों भरें।",
      false
    );

    return;
  }

  showLoginMessage(
    "⏳ Login किया जा रहा है...",
    true,
    "info"
  );

  const {
    data,
    error
  } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if (error) {

    console.error(error);

    showLoginMessage(
      "❌ Login failed: " +
      error.message,
      false
    );

    return;
  }

  document.getElementById(
    "userEmail"
  ).textContent =
    data.user.email || email;

  showDashboard();

  await loadAttendance();

}


/* =====================================
   LOGOUT
===================================== */

async function logout() {

  await supabaseClient.auth.signOut();

  attendanceData = [];

  document.getElementById(
    "attendanceBody"
  ).innerHTML = `
    <tr>
      <td colspan="6">
        Login required
      </td>
    </tr>
  `;

  showLogin();

}


/* =====================================
   LOAD ATTENDANCE
===================================== */

async function loadAttendance() {

  hideMainMessage();

  document.getElementById(
    "attendanceBody"
  ).innerHTML = `
    <tr>
      <td colspan="6">
        ⏳ Attendance load हो रही है...
      </td>
    </tr>
  `;

  const {
    data: sessionData
  } =
    await supabaseClient.auth.getSession();

  if (!sessionData.session) {

    showLogin();

    return;
  }

  const {
    data,
    error
  } =
    await supabaseClient.rpc(
      "get_attendance_history"
    );

  if (error) {

    console.error(error);

    showMainMessage(
      "❌ Attendance history load नहीं हो सकी।",
      false
    );

    return;
  }

  /*
    Function अब object return करता है:
    {
      success: true,
      records: [...]
    }
  */

  if (!data || data.success !== true) {

    showMainMessage(
      data?.message ||
      "Attendance Dashboard की अनुमति नहीं है।",
      false
    );

    document.getElementById(
      "attendanceBody"
    ).innerHTML = `
      <tr>
        <td colspan="6">
          🔒 अनुमति नहीं है
        </td>
      </tr>
    `;

    return;
  }

  attendanceData =
    Array.isArray(data.records)
      ? data.records
      : [];

  updateStats();

  renderTable(
    attendanceData
  );

}


/* =====================================
   STATISTICS
===================================== */

function updateStats() {

  document.getElementById(
    "totalRecords"
  ).textContent =
    attendanceData.length;

  const present =
    attendanceData.filter(
      item =>
        item.status === "Present"
    ).length;

  document.getElementById(
    "presentCount"
  ).textContent =
    present;

  const members =
    new Set(
      attendanceData.map(
        item =>
          item.member_id
      )
    );

  document.getElementById(
    "memberCount"
  ).textContent =
    members.size;

}


/* =====================================
   RENDER TABLE
===================================== */

function renderTable(data) {

  const body =
    document.getElementById(
      "attendanceBody"
    );

  if (!data.length) {

    body.innerHTML = `
      <tr>
        <td colspan="6">
          अभी कोई Attendance record नहीं है।
        </td>
      </tr>
    `;

    return;
  }

  body.innerHTML =
    data.map(item => {

      const date =
        formatDate(
          item.attendance_date
        );

      const time =
        formatTime(
          item.attendance_time
        );

      const statusClass =
        item.status === "Present"
          ? "present"
          : "absent";

      return `
        <tr>

          <td>
            ${escapeHtml(item.id)}
          </td>

          <td>
            ${escapeHtml(item.member_id)}
          </td>

          <td>
            ${escapeHtml(item.member_name)}
          </td>

          <td>
            ${date}
          </td>

          <td>
            ${time}
          </td>

          <td class="${statusClass}">
            ${escapeHtml(item.status)}
          </td>

        </tr>
      `;

    }).join("");

}


/* =====================================
   SEARCH
===================================== */

function filterTable() {

  const search =
    document.getElementById(
      "search"
    ).value
      .toLowerCase()
      .trim();

  const filtered =
    attendanceData.filter(
      item =>
        String(
          item.member_name || ""
        )
          .toLowerCase()
          .includes(search)
    );

  renderTable(filtered);

}


/* =====================================
   DATE
===================================== */

function formatDate(value) {

  if (!value) return "-";

  return new Date(
    value + "T00:00:00"
  ).toLocaleDateString(
    "hi-IN"
  );

}


/* =====================================
   TIME
===================================== */

function formatTime(value) {

  if (!value) return "-";

  return new Date(
    value
  ).toLocaleTimeString(
    "hi-IN",
    {
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}


/* =====================================
   LOGIN MESSAGE
===================================== */

function showLoginMessage(
  message,
  success,
  type = ""
) {

  const box =
    document.getElementById(
      "loginMessage"
    );

  box.textContent = message;

  box.className = "message";

  if (type === "info") {

    box.classList.add("info");

  } else if (success) {

    box.classList.add("success");

  } else {

    box.classList.add("error");

  }

}


/* =====================================
   MAIN MESSAGE
===================================== */

function showMainMessage(
  message,
  success,
  type = ""
) {

  const box =
    document.getElementById(
      "mainMessage"
    );

  box.textContent = message;

  box.className = "message";

  if (type === "info") {

    box.classList.add("info");

  } else if (success) {

    box.classList.add("success");

  } else {

    box.classList.add("error");

  }

}


function hideMainMessage() {

  const box =
    document.getElementById(
      "mainMessage"
    );

  box.textContent = "";

  box.className = "message";

}


/* =====================================
   HTML SECURITY
===================================== */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

</script>

</body>
</html>
