<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Classic Empire Ltd - Admin Panel</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#080808;
  color:#fff;
  min-height:100vh;
}

.container{
  width:100%;
  max-width:700px;
  margin:auto;
  padding:25px 18px;
}

.header{
  text-align:center;
  padding:35px 10px 20px;
}

.header h1{
  color:#d4af37;
  font-size:32px;
}

.header p{
  color:#999;
  margin-top:8px;
}

.panel{
  background:#111;
  border:1px solid #333;
  border-radius:15px;
  padding:25px;
  margin-top:20px;
}

.panel h2{
  text-align:center;
  color:#d4af37;
  margin-bottom:20px;
}

label{
  display:block;
  color:#d4af37;
  font-weight:bold;
  margin:14px 0 6px;
}

input,
select{
  width:100%;
  padding:13px;
  background:#1b1b1b;
  border:1px solid #555;
  border-radius:8px;
  color:#fff;
  font-size:15px;
}

button{
  width:100%;
  padding:13px;
  margin-top:18px;
  border:0;
  border-radius:8px;
  background:#d4af37;
  color:#000;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  background:#fff;
}

.logout{
  background:#333;
  color:#fff;
}

.message{
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  text-align:center;
  display:none;
}

.error{
  background:#3a1111;
  border:1px solid #a33;
  color:#ff9999;
}

.success{
  background:#113a1d;
  border:1px solid #3a9;
  color:#9f9;
}

#generatorPanel,
#historyPanel,
#submissionPanel{
  display:none;
}

.code-box{
  margin-top:20px;
  background:#050505;
  border:2px solid #d4af37;
  border-radius:10px;
  padding:20px;
  text-align:center;
}

.code-label{
  color:#aaa;
  font-size:14px;
}

.exam-code{
  color:#d4af37;
  font-size:27px;
  font-weight:bold;
  letter-spacing:2px;
  margin-top:8px;
  word-break:break-all;
}

.history-card,
.submission-card{
  background:#050505;
  border:1px solid #333;
  border-radius:10px;
  padding:15px;
  margin-top:12px;
  word-break:break-word;
}

.history-card strong,
.submission-card strong{
  color:#d4af37;
}

.status-used{
  color:#ff7777;
  font-weight:bold;
}

.status-unused{
  color:#66ff99;
  font-weight:bold;
}

.result-pass{
  color:#66ff99;
  font-weight:bold;
}

.result-fail{
  color:#ff7777;
  font-weight:bold;
}

.answer-box{
  background:#111;
  border:1px solid #333;
  border-radius:8px;
  padding:10px;
  margin-top:8px;
  white-space:pre-wrap;
}

.back{
  display:block;
  text-align:center;
  margin-top:25px;
  color:#d4af37;
  text-decoration:none;
  font-weight:bold;
}

.back:hover{
  color:#fff;
}

.footer{
  text-align:center;
  color:#666;
  margin-top:35px;
  padding-bottom:25px;
  font-size:13px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <h1>Classic Empire Ltd</h1>
  <p>🔐 Official Admin Panel</p>
</div>


<!-- LOGIN -->

<div class="panel" id="loginPanel">

  <h2>Admin Login</h2>

  <label>Email</label>

  <input
    type="email"
    id="email"
    placeholder="Admin Email"
    autocomplete="email"
  >

  <label>Password</label>

  <input
    type="password"
    id="password"
    placeholder="Admin Password"
    autocomplete="current-password"
  >

  <button onclick="adminLogin()">
    🔐 Login
  </button>

  <div id="loginMessage" class="message"></div>

</div>


<!-- GENERATOR -->

<div class="panel" id="generatorPanel">

  <h2>Exam Code Generator</h2>

  <label>Applicant Name</label>

  <input
    type="text"
    id="applicantName"
    placeholder="Applicant का नाम"
  >

  <label>Post</label>

  <select id="post">

    <option value="">-- Post चुनें --</option>

    <option value="President's Assistant">
      President's Assistant
    </option>

    <option value="DM">
      DM
    </option>

    <option value="DM's Assistant">
      DM's Assistant
    </option>

    <option value="SDM">
      SDM
    </option>

    <option value="SP">
      SP
    </option>

    <option value="DSP">
      DSP
    </option>

  </select>

  <button onclick="generateCode()">
    Generate Exam Code
  </button>

  <div id="generatorMessage" class="message"></div>

  <div class="code-box" id="codeBox" style="display:none;">

    <div class="code-label">
      Generated Exam Code
    </div>

    <div class="exam-code" id="generatedCode"></div>

    <button onclick="copyCode()">
      📋 Copy Exam Code
    </button>

  </div>

  <button class="logout" onclick="logout()">
    Logout
  </button>

</div>


<!-- CODE HISTORY -->

<div class="panel" id="historyPanel">

  <h2>Exam Code History</h2>

  <button onclick="loadCodeHistory()">
    🔄 Refresh History
  </button>

  <div id="historyMessage" class="message"></div>

  <div id="historyList"></div>

</div>


<!-- SUBMISSION HISTORY -->

<div class="panel" id="submissionPanel">

  <h2>Exam Submission History</h2>

  <button onclick="loadExamSubmissions()">
    🔄 Refresh Submissions
  </button>

  <div id="submissionMessage" class="message"></div>

  <div id="submissionList"></div>

</div>


<a href="index.html" class="back">
  ← Back to Home
</a>


<div class="footer">
  © 2026 Classic Empire Ltd
</div>

</div>


<!-- SUPABASE JS -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://hjatspkzgoddcpgwfkxo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_nw9-8f_8dfZBN7M2q27Wrg_NXk6Eij_";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


const ADMIN_UID =
"8820968d-c20b-4892-b38b-395083efd026";


/* =========================
   ADMIN LOGIN
========================= */

async function adminLogin(){

  const email =
  document.getElementById("email").value.trim();

  const password =
  document.getElementById("password").value;

  const message =
  document.getElementById("loginMessage");

  if(!email || !password){

    showMessage(
      message,
      "Email और Password दोनों डालें",
      "error"
    );

    return;
  }

  try{

    const {data,error} =
    await supabaseClient.auth.signInWithPassword({
      email:email,
      password:password
    });

    if(error){

      showMessage(
        message,
        "गलत Email या Password",
        "error"
      );

      return;
    }

    if(!data.user){

      showMessage(
        message,
        "Login सफल नहीं हुआ",
        "error"
      );

      return;
    }

    if(data.user.id !== ADMIN_UID){

      await supabaseClient.auth.signOut();

      showMessage(
        message,
        "यह Account Admin नहीं है",
        "error"
      );

      return;
    }

    const {
      data:adminData,
      error:adminError
    } =
    await supabaseClient.rpc("check_admin");

    if(
      adminError ||
      !adminData ||
      adminData.is_admin !== true
    ){

      await supabaseClient.auth.signOut();

      showMessage(
        message,
        "Admin verification failed",
        "error"
      );

      return;
    }

    showAdminPanel();

  }catch(error){

    console.error(error);

    showMessage(
      message,
      "Login में समस्या हुई।",
      "error"
    );

  }

}


/* =========================
   SHOW ADMIN PANEL
========================= */

function showAdminPanel(){

  document.getElementById(
    "loginPanel"
  ).style.display="none";

  document.getElementById(
    "generatorPanel"
  ).style.display="block";

  document.getElementById(
    "historyPanel"
  ).style.display="block";

  document.getElementById(
    "submissionPanel"
  ).style.display="block";

  loadCodeHistory();
  loadExamSubmissions();

}


/* =========================
   GENERATE CODE
========================= */

async function generateCode(){

  const name =
  document.getElementById("applicantName")
  .value.trim();

  const post =
  document.getElementById("post").value;

  const message =
  document.getElementById("generatorMessage");

  const codeBox =
  document.getElementById("codeBox");

  const generatedCode =
  document.getElementById("generatedCode");

  if(!name){

    showMessage(
      message,
      "Applicant का नाम डालें",
      "error"
    );

    return;
  }

  if(!post){

    showMessage(
      message,
      "Post चुनें",
      "error"
    );

    return;
  }

  try{

    const {
      data:sessionData
    } =
    await supabaseClient.auth.getSession();

    if(!sessionData.session){

      showMessage(
        message,
        "Login session समाप्त हो गया।",
        "error"
      );

      return;
    }

    const {
      data,
      error
    } =
    await supabaseClient.rpc(
      "generate_exam_code",
      {
        input_applicant_name:name,
        input_post:post
      }
    );

    if(error){

      console.error(error);

      showMessage(
        message,
        "Exam Code generate नहीं हुआ।",
        "error"
      );

      return;
    }

    generatedCode.textContent=data;

    codeBox.style.display="block";

    showMessage(
      message,
      "Exam Code successfully generate हो गया।",
      "success"
    );

    loadCodeHistory();

  }catch(error){

    console.error(error);

    showMessage(
      message,
      "Supabase connection में समस्या हुई।",
      "error"
    );

  }

}


/* =========================
   CODE HISTORY
========================= */

async function loadCodeHistory(){

  const list =
  document.getElementById("historyList");

  const message =
  document.getElementById("historyMessage");

  list.innerHTML="";

  try{

    const {
      data,
      error
    } =
    await supabaseClient.rpc(
      "get_exam_codes"
    );

    if(error){

      console.error(error);

      showMessage(
        message,
        "Code History load नहीं हुई।",
        "error"
      );

      return;
    }

    if(!data || data.length===0){

      list.innerHTML =
      "<p style='color:#999;text-align:center;margin-top:15px;'>अभी कोई Exam Code नहीं है।</p>";

      return;
    }

    data.forEach(item => {

      const card =
      document.createElement("div");

      card.className="history-card";

      const status =
      item.used
      ? "<span class='status-used'>Used</span>"
      : "<span class='status-unused'>Unused</span>";

      const date =
      new Date(
        item.created_at
      ).toLocaleString("en-IN");

      card.innerHTML = `

        <div>
          <strong>Applicant:</strong>
          ${escapeHtml(item.applicant_name || "")}
        </div>

        <div style="margin-top:6px;">
          <strong>Post:</strong>
          ${escapeHtml(item.post || "")}
        </div>

        <div style="margin-top:6px;">
          <strong>Code:</strong>
          <span style="color:#d4af37;">
            ${escapeHtml(item.code || "")}
          </span>
        </div>

        <div style="margin-top:6px;">
          <strong>Status:</strong>
          ${status}
        </div>

        <div style="margin-top:6px;color:#777;">
          ${date}
        </div>

      `;

      list.appendChild(card);

    });

  }catch(error){

    console.error(error);

    showMessage(
      message,
      "History load करने में समस्या हुई।",
      "error"
    );

  }

}


/* =========================
   SUBMISSION HISTORY
========================= */

async function loadExamSubmissions(){

  const list =
  document.getElementById("submissionList");

  const message =
  document.getElementById("submissionMessage");

  list.innerHTML="";

  try{

    const {
      data,
      error
    } =
    await supabaseClient.rpc(
      "get_exam_submissions"
    );

    if(error){

      console.error(error);

      showMessage(
        message,
        "Submission History load नहीं हुई।",
        "error"
      );

      return;
    }

    if(!data || data.length===0){

      list.innerHTML =
      "<p style='color:#999;text-align:center;margin-top:15px;'>अभी कोई Exam Submission नहीं है।</p>";

      return;
    }

    data.forEach(item => {

      const card =
      document.createElement("div");

      card.className="submission-card";

      const result =
      String(item.final_result || "").toLowerCase();

      let resultHtml="";

      if(result.includes("pass")){

        resultHtml =
        "<span class='result-pass'>PASS</span>";

      }else if(result.includes("fail")){

        resultHtml =
        "<span class='result-fail'>FAIL</span>";

      }else{

        resultHtml =
        escapeHtml(item.final_result || "Pending");

      }

      const date =
      new Date(
        item.submitted_at
      ).toLocaleString("en-IN");

      card.innerHTML = `

        <div>
          <strong>Applicant:</strong>
          ${escapeHtml(item.applicant_name || "")}
        </div>

        <div style="margin-top:6px;">
          <strong>Post:</strong>
          ${escapeHtml(item.post || "")}
        </div>

        <div style="margin-top:6px;">
          <strong>Exam Code:</strong>
          <span style="color:#d4af37;">
            ${escapeHtml(item.exam_code || "")}
          </span>
        </div>

        <div style="margin-top:6px;">
          <strong>Objective Score:</strong>
          ${escapeHtml(item.objective_score ?? 0)} / 18
        </div>

        <div style="margin-top:6px;">
          <strong>Subjective Marks:</strong>
          ${escapeHtml(item.subjective_marks ?? 0)}
        </div>

        <div style="margin-top:6px;">
          <strong>Total Marks:</strong>
          ${escapeHtml(item.total_marks ?? 0)}
        </div>

        <div style="margin-top:6px;">
          <strong>Result:</strong>
          ${resultHtml}
        </div>

        <div style="margin-top:12px;">
          <strong>Subjective Answer 1:</strong>

          <div class="answer-box">
            ${escapeHtml(item.subjective_answer_1 || "कोई उत्तर नहीं")}
          </div>
        </div>

        <div style="margin-top:12px;">
          <strong>Subjective Answer 2:</strong>

          <div class="answer-box">
            ${escapeHtml(item.subjective_answer_2 || "कोई उत्तर नहीं")}
          </div>
        </div>

        <div style="margin-top:10px;color:#777;">
          Submitted:
          ${date}
        </div>

      `;

      list.appendChild(card);

    });

  }catch(error){

    console.error(error);

    showMessage(
      message,
      "Submission History load करने में समस्या हुई।",
      "error"
    );

  }

}


/* =========================
   COPY CODE
========================= */

async function copyCode(){

  const code =
  document.getElementById(
    "generatedCode"
  ).textContent;

  try{

    await navigator.clipboard.writeText(code);

    alert("Exam Code copied!");

  }catch(error){

    alert("Code copy नहीं हुआ।");

  }

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await supabaseClient.auth.signOut();

  document.getElementById(
    "generatorPanel"
  ).style.display="none";

  document.getElementById(
    "historyPanel"
  ).style.display="none";

  document.getElementById(
    "submissionPanel"
  ).style.display="none";

  document.getElementById(
    "loginPanel"
  ).style.display="block";

}


/* =========================
   MESSAGE
========================= */

function showMessage(
  element,
  text,
  type
){

  element.textContent=text;

  element.className=
  "message "+type;

  element.style.display="block";

}


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(value){

  return String(value)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* =========================
   EXISTING SESSION
========================= */

async function checkExistingSession(){

  try{

    const {
      data
    } =
    await supabaseClient.auth.getSession();

    if(!data.session){
      return;
    }

    if(
      data.session.user.id !== ADMIN_UID
    ){

      await supabaseClient.auth.signOut();

      return;
    }

    const {
      data:adminData,
      error
    } =
    await supabaseClient.rpc(
      "check_admin"
    );

    if(
      !error &&
      adminData &&
      adminData.is_admin===true
    ){

      showAdminPanel();

    }else{

      await supabaseClient.auth.signOut();

    }

  }catch(error){

    console.error(error);

  }

}


window.addEventListener(
  "load",
  checkExistingSession
);

</script>

</body>
</html>
