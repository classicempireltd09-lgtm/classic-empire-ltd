/* ================================
   START EXAM
================================ */

function startExam(){

const name =
document.getElementById("candidateName").value.trim();

const code =
document.getElementById("examCode").value.trim().toUpperCase();

const post =
document.getElementById("postSelect").value;

const message =
document.getElementById("loginMessage");


/* TEMPORARY TEST CODE */

if(code !== "CE-TEST-123456"){

message.innerHTML =
"❌ Invalid Exam Access Code.";

message.style.color="#ff6b6b";

return;
}

if(name === ""){

message.innerHTML =
"⚠️ Please enter Applicant Name.";

message.style.color="#ffcc55";

return;
}

if(post === ""){

message.innerHTML =
"⚠️ Please select an Examination Post.";

message.style.color="#ffcc55";

return;
}


/* SHOW EXAM */

document.getElementById("loginBox").style.display="none";

document.getElementById("examArea").style.display="block";

document.getElementById("showName").textContent=name;

document.getElementById("showPost").textContent=post;

loadQuestions(post);

window.scrollTo(0,0);

}


/* ================================
   LOAD QUESTIONS
================================ */

function loadQuestions(post){

const container =
document.getElementById("questions");

container.innerHTML="";

const paper = examData[post];

paper.forEach((item,index)=>{

const div =
document.createElement("div");

div.className="question";

let html="";

html +=
'<div class="type">'+
item.type+
'</div>';

html +=
'<div class="question-title">'+
(index+1)+". "+
item.q+
'</div>';


/* SUBJECTIVE */

if(item.type === "SUBJECTIVE"){

html +=
'<textarea '+
'name="q'+index+'" '+
'placeholder="Write your answer here...">'+
'</textarea>';

}


/* OBJECTIVE */

else{

item.options.forEach((option,optIndex)=>{

const letter =
String.fromCharCode(65+optIndex);

html +=
'<label class="option">'+

'<input type="radio" '+
'name="q'+index+'" '+
'value="'+optIndex+'"> '+

letter+". "+option+

'</label>';

});

}

div.innerHTML=html;

container.appendChild(div);

});

}


/* ================================
   SUBMIT EXAM
================================ */

function submitExam(){

const post =
document.getElementById("showPost").textContent;

const paper =
examData[post];

let score=0;

let unanswered=0;

let subjectiveCount=0;

paper.forEach((item,index)=>{

if(item.type==="SUBJECTIVE"){

subjectiveCount++;

return;

}

const selected =
document.querySelector(
'input[name="q'+index+'"]:checked'
);

if(!selected){

unanswered++;

return;

}

if(Number(selected.value) === item.answer){

score++;

}

});


const totalObjective =
paper.length-subjectiveCount;

const percentage =
Math.round((score/totalObjective)*100);

const passed =
percentage>=60;


document.getElementById("examArea").style.display="none";

document.getElementById("result").style.display="block";


let resultHTML="";

resultHTML +=
"<p><strong>Applicant:</strong> "+
document.getElementById("showName").textContent+
"</p>";

resultHTML +=
"<p><strong>Post:</strong> "+
post+
"</p>";

resultHTML +=
"<p><strong>Objective Score:</strong> "+
score+" / "+totalObjective+
"</p>";

resultHTML +=
"<p><strong>Percentage:</strong> "+
percentage+"%</p>";

resultHTML +=
"<p><strong>Unanswered Objective Questions:</strong> "+
unanswered+
"</p>";

resultHTML +=
"<p><strong>Subjective Questions:</strong> "+
subjectiveCount+
"</p>";

if(passed){

resultHTML +=
'<p class="pass">✅ OBJECTIVE EXAM PASSED</p>';

}else{

resultHTML +=
'<p class="fail">❌ OBJECTIVE EXAM NOT PASSED</p>';

}

document.getElementById("resultText").innerHTML =
resultHTML;

window.scrollTo(0,0);

}
