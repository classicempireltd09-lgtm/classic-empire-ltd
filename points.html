<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Classic Empire Ltd - Points Management</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#080808;
  color:#fff;
  min-height:100vh;
}

header{
  background:linear-gradient(135deg,#111,#1d1400);
  border-bottom:2px solid #d4af37;
  padding:22px 15px;
  text-align:center;
}

header h1{
  color:#d4af37;
  font-size:28px;
  margin-bottom:7px;
}

header p{
  color:#ccc;
  font-size:14px;
}

.container{
  width:94%;
  max-width:1100px;
  margin:25px auto;
}

.card{
  background:#111;
  border:1px solid #333;
  border-radius:15px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 8px 25px rgba(0,0,0,.35);
}

.card h2{
  color:#d4af37;
  margin-bottom:15px;
}

label{
  display:block;
  margin:10px 0 6px;
  color:#ddd;
}

input,select{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #555;
  background:#080808;
  color:#fff;
  font-size:15px;
}

button{
  border:none;
  border-radius:9px;
  padding:12px 18px;
  cursor:pointer;
  font-weight:bold;
  font-size:15px;
  margin-top:12px;
}

.gold-btn{
  background:#d4af37;
  color:#000;
}

.red-btn{
  background:#b22222;
  color:#fff;
}

.status{
  padding:12px;
  border-radius:8px;
  margin-top:12px;
  display:none;
}

.success{
  display:block;
  background:#123b20;
  color:#8ff0a4;
}

.error{
  display:block;
  background:#421515;
  color:#ff9b9b;
}

.hidden{
  display:none !important;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.date-box{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:800px;
}

th,td{
  border:1px solid #333;
  padding:12px 8px;
  text-align:center;
}

th{
  background:#191300;
  color:#d4af37;
}

td{
  background:#0d0d0d;
}

.member-name{
  font-weight:bold;
  color:#fff;
  text-align:left;
}

.point-input{
  width:80px;
  text-align:center;
}

.total{
  color:#d4af37;
  font-weight:bold;
}

.award{
  font-weight:bold;
}

.small{
  color:#aaa;
  font-size:13px;
  margin-top:6px;
}

.loading{
  text-align:center;
  padding:25px;
  color:#d4af37;
}

.footer{
  text-align:center;
  padding:30px 10px;
  color:#777;
  font-size:13px;
}

@media(max-width:650px){
  .date-box{
    grid-template-columns:1fr;
  }

  header h1{
    font-size:22px;
  }

  .container{
    width:96%;
  }
}
</style>
</head>

<body>

<header>
  <h1>Classic Empire Ltd</h1>
  <p>Points Management System</p>
</header>

<div class="container">

  <!-- LOGIN -->
  <div id="loginCard" class="card">

    <h2>Points Editor Login</h2>

    <p class="small">
      Only President and President's Assistant can edit points.
    </p>

    <label>Email</label>
    <input
      type="email"
      id="email"
      placeholder="Enter email"
      autocomplete="username"
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter password"
      autocomplete="current-password"
    >

    <button class="gold-btn" onclick="login()">
      Login
    </button>

    <div id="loginStatus" class="status"></div>

  </div>


  <!-- MANAGEMENT -->
  <div id="management" class="hidden">

    <div class="card">

      <div class="topbar">

        <div>
          <h2>Points Management</h2>
          <p id="loggedUser" class="small"></p>
        </div>

        <button class="red-btn" onclick="logout()">
          Logout
        </button>

      </div>

    </div>


    <div class="card">

      <h2>Select Date</h2>

      <div class="date-box">

        <div>
          <label>Point Date</label>
          <input type="date" id="pointDate">
        </div>

        <div>
          <label>Management</label>
          <button
            class="gold-btn"
            style="width:100%"
            onclick="loadPoints()"
          >
            Load Points
          </button>
        </div>

      </div>

      <div id="pageStatus" class="status"></div>

    </div>


    <div class="card">

      <h2>Daily Points</h2>

      <div id="tableArea" class="loading">
        Select a date and load points.
      </div>

    </div>

  </div>

</div>

<div class="footer">
  Classic Empire Ltd • Chakla Ghat, Kishanganj, Bihar, India
</div>


<script>

const SUPABASE_URL =
"https://hjatspkzgoddcpgwfkxo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_nw9-8f_8dfZBN7M2q27Wrg_NXk6Eij_";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


const members = [
  "Jakir Hussain",
  "Noor Ahmad",
  "Shahnawaz Alam",
  "Tabshir Alam",
  "Aszad Sayeed",
  "Shadat Hussain",
  "Mahir Alam",
  "Sajjad Alam",
  "Shadab Alam"
];


let currentUser = null;
let dashboardData = [];


/* -----------------------------
   DEFAULT DATE
----------------------------- */

function setToday(){

  const now = new Date();

  const year =
    now.getFullYear();

  const month =
    String(now.getMonth()+1).padStart(2,"0");

  const day =
    String(now.getDate()).padStart(2,"0");

  document.getElementById("pointDate").value =
    `${year}-${month}-${day}`;
}


/* -----------------------------
   STATUS
----------------------------- */

function showStatus(
  elementId,
  message,
  type
){

  const el =
    document.getElementById(elementId);

  el.textContent = message;

  el.className =
    "status " + type;
}


/* -----------------------------
   LOGIN
----------------------------- */

async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if(!email || !password){

    showStatus(
      "loginStatus",
      "Email और Password दोनों required हैं।",
      "error"
    );

    return;
  }

  showStatus(
    "loginStatus",
    "Login हो रहा है...",
    "success"
  );

  const {data,error} =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if(error){

    showStatus(
      "loginStatus",
      error.message,
      "error"
    );

    return;
  }

  currentUser = data.user;

  await checkEditor();

}


/* -----------------------------
   CHECK EDITOR
----------------------------- */

async function checkEditor(){

  const {
    data,
    error
  } =
    await supabaseClient.rpc(
      "is_points_editor"
    );

  if(error){

    showStatus(
      "loginStatus",
      error.message,
      "error"
    );

    await supabaseClient.auth.signOut();

    return;
  }

  if(data !== true){

    showStatus(
      "loginStatus",
      "यह account Points Editor नहीं है। केवल President या President Assistant access कर सकते हैं।",
      "error"
    );

    await supabaseClient.auth.signOut();

    return;
  }

  document.getElementById("loginCard")
    .classList.add("hidden");

  document.getElementById("management")
    .classList.remove("hidden");

  document.getElementById("loggedUser")
    .textContent =
    "Logged in: " +
    (currentUser.email || "Authenticated User");

  setToday();

  await loadPoints();

}


/* -----------------------------
   LOAD POINTS
----------------------------- */

async function loadPoints(){

  const date =
    document.getElementById("pointDate").value;

  if(!date){

    showStatus(
      "pageStatus",
      "Date select करें।",
      "error"
    );

    return;
  }

  document.getElementById("tableArea").innerHTML =
    '<div class="loading">Loading points...</div>';

  const {
    data,
    error
  } =
    await supabaseClient.rpc(
      "get_points_dashboard",
      {
        input_date: date
      }
    );

  if(error){

    document.getElementById("tableArea").innerHTML =
      "";

    showStatus(
      "pageStatus",
      error.message,
      "error"
    );

    return;
  }

  dashboardData =
    Array.isArray(data)
      ? data
      : [];

  renderTable();

}


/* -----------------------------
   RENDER TABLE
----------------------------- */

function renderTable(){

  if(!dashboardData.length){

    document.getElementById("tableArea").innerHTML =
      "<p>No members found.</p>";

    return;
  }

  let html = `
    <div class="table-wrap">

    <table>

      <thead>

        <tr>
          <th>Member</th>
          <th>School / Madrasa</th>
          <th>Game Work</th>
          <th>Daily Total</th>
          <th>Action</th>
        </tr>

      </thead>

      <tbody>
  `;


  dashboardData.forEach((member,index)=>{

    const school =
      Number(member.school_points || 0);

    const game =
      Number(member.game_points || 0);

    const total =
      school + game;


    html += `
      <tr>

        <td class="member-name">
          ${escapeHtml(member.member_name)}
        </td>

        <td>
          <input
            class="point-input"
            type="number"
            min="0"
            max="1"
            step="1"
            id="school_${index}"
            value="${school}"
          >
        </td>

        <td>
          <input
            class="point-input"
            type="number"
            min="0"
            max="2"
            step="1"
            id="game_${index}"
            value="${game}"
          >
        </td>

        <td
          class="total"
          id="total_${index}"
        >
          ${total}/3
        </td>

        <td>
          <button
            class="gold-btn"
            onclick="saveMember(${index})"
          >
            Save
          </button>
        </td>

      </tr>
    `;

  });


  html += `
      </tbody>

    </table>

    </div>
  `;


  document.getElementById("tableArea")
    .innerHTML = html;


  dashboardData.forEach((_,index)=>{

    document.getElementById(
      "school_" + index
    ).addEventListener(
      "input",
      ()=>updateTotal(index)
    );

    document.getElementById(
      "game_" + index
    ).addEventListener(
      "input",
      ()=>updateTotal(index)
    );

  });

}


/* -----------------------------
   UPDATE DAILY TOTAL
----------------------------- */

function updateTotal(index){

  let school =
    Number(
      document.getElementById(
        "school_" + index
      ).value || 0
    );

  let game =
    Number(
      document.getElementById(
        "game_" + index
      ).value || 0
    );


  if(school < 0) school = 0;
  if(school > 1) school = 1;

  if(game < 0) game = 0;
  if(game > 2) game = 2;


  document.getElementById(
    "school_" + index
  ).value = school;

  document.getElementById(
    "game_" + index
  ).value = game;


  document.getElementById(
    "total_" + index
  ).textContent =
    `${school + game}/3`;

}


/* -----------------------------
   SAVE MEMBER
----------------------------- */

async function saveMember(index){

  const member =
    dashboardData[index];

  const date =
    document.getElementById("pointDate").value;

  let school =
    Number(
      document.getElementById(
        "school_" + index
      ).value
    );

  let game =
    Number(
      document.getElementById(
        "game_" + index
      ).value
    );


  if(!Number.isInteger(school)
     || school < 0
     || school > 1){

    showStatus(
      "pageStatus",
      "School/Madrasa Point केवल 0 या 1 होना चाहिए।",
      "error"
    );

    return;
  }


  if(!Number.isInteger(game)
     || game < 0
     || game > 2){

    showStatus(
      "pageStatus",
      "Game Work Point केवल 0 से 2 होना चाहिए।",
      "error"
    );

    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient.rpc(
      "save_daily_points",
      {
        input_member_id:
          member.id,

        input_point_date:
          date,

        input_school_point:
          school,

        input_game_point:
          game
      }
    );


  if(error){

    showStatus(
      "pageStatus",
      error.message,
      "error"
    );

    return;
  }


  if(data && data.success === false){

    showStatus(
      "pageStatus",
      data.message || "Save failed.",
      "error"
    );

    return;
  }


  showStatus(
    "pageStatus",
    member.member_name +
    " के points successfully saved.",
    "success"
  );


  await loadPoints();

}


/* -----------------------------
   LOGOUT
----------------------------- */

async function logout(){

  await supabaseClient.auth.signOut();

  currentUser = null;

  document.getElementById("management")
    .classList.add("hidden");

  document.getElementById("loginCard")
    .classList.remove("hidden");

  document.getElementById("password")
    .value = "";

  showStatus(
    "loginStatus",
    "Logout successful.",
    "success"
  );

}


/* -----------------------------
   ESCAPE HTML
----------------------------- */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* -----------------------------
   EXISTING SESSION
----------------------------- */

async function checkExistingSession(){

  const {
    data
  } =
    await supabaseClient.auth.getSession();

  if(data.session){

    currentUser =
      data.session.user;

    await checkEditor();

  }else{

    setToday();

  }

}


/* -----------------------------
   AUTH STATE
----------------------------- */

supabaseClient.auth.onAuthStateChange(
  async (event,session)=>{

    if(event === "SIGNED_OUT"){

      currentUser = null;

      document.getElementById("management")
        .classList.add("hidden");

      document.getElementById("loginCard")
        .classList.remove("hidden");

    }

  }
);


/* -----------------------------
   START
----------------------------- */

checkExistingSession();

</script>

</body>
</html>
