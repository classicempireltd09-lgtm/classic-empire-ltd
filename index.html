<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classic Empire Ltd</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,sans-serif;
  background:#080808;
  color:#fff;
  line-height:1.6;
}

.container{
  width:92%;
  max-width:1200px;
  margin:auto;
}

header{
  background:#0b0b0b;
  border-bottom:1px solid #333;
  position:sticky;
  top:0;
  z-index:1000;
}

.nav{
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:bold;
  color:#ffd700;
  font-size:20px;
}

.brand img{
  width:42px;
  height:42px;
  object-fit:contain;
}

nav{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
}

nav a{
  color:#fff;
  text-decoration:none;
  padding:9px 12px;
  border-radius:8px;
  font-size:14px;
}

nav a:hover{
  background:#222;
  color:#ffd700;
}

.hero{
  text-align:center;
  padding:80px 20px;
  background:
    radial-gradient(circle at top,#222 0%,#080808 55%);
}

.hero h1{
  color:#ffd700;
  font-size:48px;
  margin-bottom:15px;
}

.hero p{
  max-width:750px;
  margin:auto;
  color:#ccc;
}

.badge{
  display:inline-block;
  margin-top:20px;
  padding:8px 15px;
  border:1px solid #ffd700;
  color:#ffd700;
  border-radius:20px;
}

section{
  padding:60px 0;
}

.section-title{
  text-align:center;
  color:#ffd700;
  font-size:32px;
  margin-bottom:10px;
}
