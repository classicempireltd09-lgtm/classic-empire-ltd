<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Classic Empire Ltd - Result</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#080808;
  color:#fff;
  min-height:100vh;
}

header{
  text-align:center;
  padding:25px 15px;
  border-bottom:2px solid #d4af37;
  background:#111;
}

header h1{
  color:#d4af37;
}

header p{
  color:#aaa;
  margin-top:7px;
}

.container{
  width:94%;
  max-width:650px;
  margin:30px auto;
}

.card{
  background:#111;
  border:1px solid #333;
  border-radius:14px;
  padding:22px;
  margin-bottom:20px;
}

h2{
  color:#d4af37;
  margin-bottom:18px;
}

input{
  width:100%;
  padding:13px;
  background:#1b1b1b;
  border:1px solid #444;
  border-radius:8px;
  color:#fff;
  margin:8px 0 14px;
}

button{
  padding:12px 18px;
  border:0;
  border-radius:8px;
  background:#d4af37;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

.message{
  margin-top:15px;
  padding:12px;
  background:#181818;
  border:1px solid #333;
  border-radius:8px;
}

.result{
  margin-top:20px;
  background:#111;
  border:2px solid #d4af37;
  border-radius:14px;
  padding:22px;
}

.row{
  display:flex;
  justify-content:space-between;
  padding:13px 0;
  border-bottom:1px solid #333;
}

.row b{
  color:#d4af37;
}

.final{
  text-align:center;
  font-size:30px;
  font-weight:bold;
  margin-top:20px;
  padding:15px;
  border-radius:10px;
}

.pass{
  background:#123d27;
  color:#39df82;
}

.fail{
  background:#421919;
  color:#ff6262;
}
</style>
</head>

<body>

<header>
  <h1>🏛️ Classic Empire Ltd</h1>
  <p>Exam Result Portal</p>
</header>

<div class="container">

  <div class="card">

    <h2>📊 Check Exam Result</h2>

    <input
      type="text"
      id="examCode"
      placeholder="Enter Exam Code"
      autocomplete="off"
    >

    <button onclick="checkResult()">
      🔎 Check Result
    </button>

    <div id="message" class="message"></div>

  </div>

  <div id="resultBox"></div>

</div>


<script>

const SUPABASE_URL =
"https://hjatspkzgoddcpgwfkxo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_nw9-8f_8dfZBN7M2q27Wrg_NXk6Eij_";


async function checkResult(){

  const code =
    document
      .getElementById("examCode")
      .value
      .trim()
      .toUpperCase();

  const message =
    document.getElementById("message");

  const resultBox =
    document.getElementById("resultBox");


  if(!code){

    message.innerText =
      "Exam Code डालें।";

    return;
  }


  message.innerText =
    "Result खोजा जा रहा है...";

  resultBox.innerHTML = "";


  try{

    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/rpc/get_exam_result`,
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json",
            "apikey":SUPABASE_KEY,
            "Authorization":
              `Bearer ${SUPABASE_KEY}`
          },

          body:JSON.stringify({
            input_exam_code:code
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok || !data?.success){

      throw new Error(
        data?.message ||
        "Result नहीं मिला।"
      );
    }


    const objective =
      Number(data.objective_score || 0);

    const subjective =
      Number(data.subjective_marks || 0);

    const total =
      Number(data.total_marks || 0);

    const percentage =
      ((total / 28) * 100)
        .toFixed(2);

    const result =
      data.final_result;

    const resultClass =
      result === "PASS"
        ? "pass"
        : "fail";


    resultBox.innerHTML = `

      <div class="result">

        <h2>🎓 Exam Result</h2>

        <div class="row">
          <span>Applicant</span>
          <b>
            ${escapeHtml(data.applicant_name)}
          </b>
        </div>

        <div class="row">
          <span>Post</span>
          <b>
            ${escapeHtml(data.post)}
          </b>
        </div>

        <div class="row">
          <span>Objective</span>
          <b>${objective} / 18</b>
        </div>

        <div class="row">
          <span>Subjective</span>
          <b>${subjective} / 10</b>
        </div>

        <div class="row">
          <span>Total</span>
          <b>${total} / 28</b>
        </div>

        <div class="row">
          <span>Percentage</span>
          <b>${percentage}%</b>
        </div>

        <div class="final ${resultClass}">
          ${escapeHtml(result)}
        </div>

      </div>

    `;


    message.innerText =
      "✅ Result मिल गया।";


  }catch(error){

    message.innerText =
      "❌ " + error.message;
  }
}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

</script>

</body>
</html>
