<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Empire</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    header h1 {
      font-size: 28px;
    }

    nav {
      margin-top: 15px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .person {
      background: white;
      padding: 22px;
      margin-bottom: 18px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .person h2 {
      margin-bottom: 8px;
    }

    .person p {
      font-size: 17px;
    }

    #contact {
      margin-top: 45px;
      background: white;
      padding: 25px;
      border-radius: 12px;
    }

    footer {
      text-align: center;
      padding: 25px;
      margin-top: 40px;
      background: #111;
      color: white;
    }
  </style>
</head>

<body>

  <header>
    <!-- अपना Classic Empire logo यहाँ रखें -->
    <img src="logo.png" alt="Classic Empire Logo" class="logo">

    <h1>Classic Empire</h1>

    <nav>
      <a href="#people">People</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>

    <section id="people">
      <div class="person">
        <h2>President</h2>
        <p><strong>Noor Ahmad</strong></p>
      </div>

      <div class="person">
        <h2>President's Assistant</h2>
        <p><strong>Tabshir</strong></p>
      </div>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p>Contact information will be added here.</p>
    </section>

  </main>

  <footer>
    <p>© Classic Empire</p>
  </footer>

</body>
</html>
