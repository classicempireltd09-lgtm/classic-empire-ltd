<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Classic Empire Ltd - Admin Panel</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#080808;
  color:#fff;
  min-height:100vh;
  padding:20px;
}

.container{
  max-width:1200px;
  margin:auto;
}

h1{
  text-align:center;
  color:#ffd700;
  margin-bottom:25px;
}

h2{
  color:#ffd700;
  margin-bottom:18px;
}

.panel{
  background:#111;
  border:1px solid #333;
  border-radius:15px;
  padding:20px;
  margin-bottom:25px;
  box-shadow:0 0 15px rgba(255,215,0,.08);
}

input,select,textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:8px;
  border:1px solid #555;
  background:#1b1b1b;
  color:#fff;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  padding:11px 18px;
  border:none;
  border-radius:8px;
  background:#ffd700;
  color:#000;
  font-weight:bold;
  cursor:pointer;
  margin:5px;
}

button:hover{
  background:#fff;
}

.danger{
  background:#d33;
  color:#fff;
}

.success{
  color:#00ff88;
}

.error{
  color:#ff5555;
}

.message{
  margin:10px 0;
  padding:10px;
  border-radius:8px;
}

.login-box{
  max-width:450px;
  margin:70px auto;
}

.hidden{
  display:none;
}

.card{
  background:#181818;
  border:1px solid #333;
  border-radius:12px;
  padding:16px;
  margin:12px 0;
}

.card strong{
  color:#ffd700;
}

.badge{
  display:inline-block;
  padding:5px 10px;
  border-radius:20px;
  background:#333;
  margin-top:8px;
  font-size:13px;
}

.pending{
  color:#ffd700;
}

.approved{
  color:#00ff88;
}

.rejected{
  color:#ff5555;
}

.code{
  font-size:20px;
  color:#ffd700;
  font-weight:bold;
  letter-spacing:2px;
}

.small{
  color:#aaa;
  font-size:13px;
  margin-top:6px;
}

pre{
  white-space:pre-wrap;
  word-break:break-word;
  color:#ddd;
  background:#0d0d0d;
  padding:10px;
  border-radius:8px;
  margin-top:8px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.empty{
  color:#888;
  text-align:center;
  padding:20px;
}

@media(max-width:600px){
  body{
    padding:10px;
  }

  .panel{
    padding:14px;
  }

  button{
    width:100%;
    margin:5px 0;
  }
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<div id="loginPanel" class="login-box panel">

  <h1>Classic Empire Ltd</h1>

  <h2>🔐 Admin Login</h2>

  <input
    type="email"
    id="email"
    placeholder="Admin Email"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
  >

  <button onclick="adminLogin()">
    Login
  </button>

  <div id="loginMessage" class="message"></div>

</div>


<!-- ADMIN -->
<div id="adminPanel" class="hidden">

  <div class="topbar">
    <h1>👑 Classic Empire Ltd — Admin Panel</h1>

    <button class="danger" onclick="logout()">
      🚪 Logout
    </button>
  </div>


  <!-- APPLICATIONS -->
  <div class="panel">

    <h2>📝 Applicant Applications</h2>

    <button onclick="loadApplications()">
      🔄 Refresh Applications
    </button>

    <div id="applicationMessage" class="message"></div>

    <div id="applicationList"></div>

  </div>


  <!-- EXAM CODE GENERATOR -->
  <div class="panel">

    <h2>🎟️ Exam Code Generator</h2>

    <input
      type="text"
      id="codeApplicantName"
      placeholder="Applicant Name"
    >

    <select id="codePost">

      <option value="">
        Select Post
      </option>

      <option>President's Assistant</option>
      <option>DM</option>
      <option>DM's Assistant</option>
      <option>SDM</option>
      <option>SP</option>
      <option>DSP</option>

    </select>

    <button onclick="generateCode()">
      Generate Exam Code
    </button>

    <div id="codeMessage" class="message"></div>

  </div>


  <!-- CODE HISTORY -->
  <div class="panel">

    <h2>📋 Exam Code History</h2>

    <button onclick="loadExamCodes()">
      🔄 Refresh Codes
    </button>

    <div id="codeHistoryMessage" class="message"></div>

    <div id="codeList"></div>

  </div>


  <!-- SUBMISSIONS -->
  <div class="panel" id="submissionPanel">

    <h2>📊 Exam Submission History</h2>

    <button onclick="loadExamSubmissions()">
      🔄 Refresh Submissions
    </button>

    <div id="submissionMessage" class="message"></div>

    <div id="submissionList"></div>

  </div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://hjatspkzgoddcpgwfkxo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_nw9-8f_8dfZBN7M2q27Wrg_NXk6Eij_";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// ===============================
// HTML ESCAPE
// ===============================

function escapeHTML(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


// ===============================
// LOGIN
// ===============================

async function adminLogin(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  message.innerHTML = "";

  if(!email || !password){

    message.innerHTML =
      "<span class='error'>Email और Password भरें।</span>";

    return;
  }

  const {error} =
    await supabaseClient.auth.signInWithPassword({
      email:email,
      password:password
    });

  if(error){

    message.innerHTML =
      "<span class='error'>" +
      escapeHTML(error.message) +
      "</span>";

    return;
  }

  await verifyAdmin();

}


// ===============================
// VERIFY ADMIN
// ===============================

async function verifyAdmin(){

  const {data,error} =
    await supabaseClient.rpc("check_admin");

  if(error){

    alert("Admin verification failed");

    await supabaseClient.auth.signOut();

    return;
  }

  if(!data || data.is_admin !== true){

    alert("यह Account Admin नहीं है।");

    await supabaseClient.auth.signOut();

    return;
  }

  document
    .getElementById("loginPanel")
    .classList.add("hidden");

  document
    .getElementById("adminPanel")
    .classList.remove("hidden");

  loadApplications();
  loadExamCodes();
  loadExamSubmissions();

}


// ===============================
// SESSION CHECK
// ===============================

async function checkSession(){

  const {data} =
    await supabaseClient.auth.getSession();

  if(data.session){

    await verifyAdmin();

  }

}

checkSession();


// ===============================
// LOGOUT
// ===============================

async function logout(){

  await supabaseClient.auth.signOut();

  location.reload();

}


// ===============================
// APPLICATIONS
// ===============================

async function loadApplications(){

  const list =
    document.getElementById("applicationList");

  const message =
    document.getElementById("applicationMessage");

  list.innerHTML = "";
  message.innerHTML = "Loading...";

  const {data,error} =
    await supabaseClient.rpc("get_applications");

  if(error){

    message.innerHTML =
      "<span class='error'>" +
      escapeHTML(error.message) +
      "</span>";

    return;
  }

  message.innerHTML = "";

  if(!data || data.length === 0){

    list.innerHTML =
      "<div class='empty'>अभी कोई application नहीं है।</div>";

    return;
  }

  data.forEach(app => {

    let statusClass = "pending";

    if(app.status === "Approved"){
      statusClass = "approved";
    }

    if(app.status === "Rejected"){
      statusClass = "rejected";
    }

    const card =
      document.createElement("div");

    card.className = "card";

    card.innerHTML = `

      <div>
        <strong>Applicant Name:</strong>
        ${escapeHTML(app.applicant_name)}
      </div>

      <div>
        <strong>Age:</strong>
        ${escapeHTML(app.age)}
      </div>

      <div>
        <strong>Class:</strong>
        ${escapeHTML(app.class)}
      </div>

      <div>
        <strong>Post:</strong>
        ${escapeHTML(app.post)}
      </div>

      <div>
        <strong>Email:</strong>
        ${escapeHTML(app.applicant_email)}
      </div>

      <div>
        <strong>Contact:</strong>
        ${escapeHTML(app.contact_number)}
      </div>

      <div>
        <strong>Photo:</strong>
        ${escapeHTML(app.applicant_photo)}
      </div>

      <div>
        <strong>Reason:</strong>

        <pre>${escapeHTML(app.reason)}</pre>

      </div>

      <div>
        <strong>Status:</strong>

        <span class="badge ${statusClass}">
          ${escapeHTML(app.status || "Pending")}
        </span>

      </div>

      <div class="small">
        Applied:
        ${escapeHTML(
          new Date(app.created_at).toLocaleString()
        )}
      </div>

      <hr style="margin:15px 0;border-color:#333">

      <button
        onclick="generateApplicantCode(
          '${escapeHTML(app.applicant_name).replace(/'/g,"\\'")}',
          '${escapeHTML(app.post).replace(/'/g,"\\'")}'
        )"
      >
        🎟️ Generate Exam Code
      </button>

    `;

    list.appendChild(card);

  });

}


// ===============================
// GENERATE CODE FROM APPLICATION
// ===============================

async function generateApplicantCode(
  applicantName,
  post
){

  document
    .getElementById("codeApplicantName")
    .value = applicantName;

  document
    .getElementById("codePost")
    .value = post;

  await generateCode();

}


// ===============================
// GENERATE EXAM CODE
// ===============================

async function generateCode(){

  const applicantName =
    document
      .getElementById("codeApplicantName")
      .value
      .trim();

  const post =
    document
      .getElementById("codePost")
      .value;

  const message =
    document.getElementById("codeMessage");

  message.innerHTML = "";

  if(!applicantName || !post){

    message.innerHTML =
      "<span class='error'>" +
      "Applicant Name और Post चुनें।" +
      "</span>";

    return;
  }

  message.innerHTML = "Generating...";

  const {data,error} =
    await supabaseClient.rpc(
      "generate_exam_code",
      {
        input_applicant_name: applicantName,
        input_post: post
      }
    );

  if(error){

    message.innerHTML =
      "<span class='error'>" +
      escapeHTML(error.message) +
      "</span>";

    return;
  }

  message.innerHTML =
    "<span class='success'>" +
    "Exam Code Generated: " +
    "<span class='code'>" +
    escapeHTML(data) +
    "</span>" +
    "</span>";

  loadExamCodes();

}


// ===============================
// EXAM CODE HISTORY
// ===============================

async function loadExamCodes(){

  const list =
    document.getElementById("codeList");

  const message =
    document.getElementById("codeHistoryMessage");

  list.innerHTML = "";
  message.innerHTML = "Loading...";

  const {data,error} =
    await supabaseClient.rpc(
      "get_exam_codes"
    );

  if(error){

    message.innerHTML =
      "<span class='error'>" +
      escapeHTML(error.message) +
      "</span>";

    return;
  }

  message.innerHTML = "";

  if(!data || data.length === 0){

    list.innerHTML =
      "<div class='empty'>अभी कोई Exam Code नहीं है।</div>";

    return;
  }

  data.forEach(row => {

    const card =
      document.createElement("div");

    card.className = "card";

    const status =
      row.used
        ? "<span class='rejected'>Used</span>"
        : "<span class='approved'>Unused</span>";

    card.innerHTML = `

      <div class="code">
        ${escapeHTML(row.code)}
      </div>

      <div>
        <strong>Applicant:</strong>
        ${escapeHTML(row.applicant_name)}
      </div>

      <div>
        <strong>Post:</strong>
        ${escapeHTML(row.post)}
      </div>

      <div>
        <strong>Status:</strong>
        ${status}
      </div>

      <div class="small">
        Created:
        ${escapeHTML(
          new Date(row.created_at).toLocaleString()
        )}
      </div>

    `;

    list.appendChild(card);

  });

}


// ===============================
// EXAM SUBMISSIONS
// ===============================

async function loadExamSubmissions(){

  const list =
    document.getElementById("submissionList");

  const message =
    document.getElementById("submissionMessage");

  list.innerHTML = "";
  message.innerHTML = "Loading...";

  const {data,error} =
    await supabaseClient.rpc(
      "get_exam_submissions"
    );

  if(error){

    message.innerHTML =
      "<span class='error'>" +
      escapeHTML(error.message) +
      "</span>";

    return;
  }

  message.innerHTML = "";

  if(!data || data.length === 0){

    list.innerHTML =
      "<div class='empty'>अभी कोई exam submission नहीं है।</div>";

    return;
  }

  data.forEach(row => {

    const card =
      document.createElement("div");

    card.className = "card";

    card.innerHTML = `

      <div>
        <strong>Applicant:</strong>
        ${escapeHTML(row.applicant_name)}
      </div>

      <div>
        <strong>Post:</strong>
        ${escapeHTML(row.post)}
      </div>

      <div>
        <strong>Exam Code:</strong>
        <span class="code">
          ${escapeHTML(row.exam_code)}
        </span>
      </div>

      <div>
        <strong>Objective Score:</strong>
        ${escapeHTML(row.objective_score)} / 18
      </div>

      <div>
        <strong>Subjective Marks:</strong>
        ${escapeHTML(row.subjective_marks)}
      </div>

      <div>
        <strong>Total Marks:</strong>
        ${escapeHTML(row.total_marks)}
      </div>

      <div>
        <strong>Final Result:</strong>
        ${escapeHTML(row.final_result)}
      </div>

      <div>
        <strong>Subjective Answer 1:</strong>

        <pre>${escapeHTML(
          row.subjective_answer_1
        )}</pre>

      </div>

      <div>
        <strong>Subjective Answer 2:</strong>

        <pre>${escapeHTML(
          row.subjective_answer_2
        )}</pre>

      </div>

      <div class="small">
        Submitted:
        ${escapeHTML(
          new Date(row.submitted_at).toLocaleString()
        )}
      </div>

    `;

    list.appendChild(card);

  });

}

</script>

</body>
</html>
