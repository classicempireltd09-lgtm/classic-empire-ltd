<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classic Empire Ltd — Examination</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080808;
  color:white;
}

.container{
  max-width:850px;
  margin:30px auto;
  padding:20px;
}

.box{
  background:#111;
  border:1px solid #444;
  border-radius:15px;
  padding:25px;
}

h1{
  color:#ffd700;
  text-align:center;
}

input,select,button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:8px;
  box-sizing:border-box;
}

input,select{
  background:#222;
  color:white;
  border:1px solid #555;
}

button{
  background:#ffd700;
  color:#000;
  border:0;
  font-weight:bold;
}

.question{
  background:#181818;
  border:1px solid #333;
  padding:18px;
  margin:15px 0;
  border-radius:10px;
}

.option{
  display:block;
  padding:8px;
}

#exam{
  display:none;
}

#result{
  display:none;
  text-align:center;
}

.correct{
  color:#5cff75;
}

.wrong{
  color:#ff6464;
}
</style>
</head>

<body>

<div class="container">

<div class="box" id="login">

<h1>🏛️ Classic Empire Ltd</h1>

<p style="text-align:center">
📝 Hard-Level Mixed Examination
</p>

<input id="name" placeholder="Applicant Name">

<input id="code" placeholder="Exam Access Code">

<select id="post">

<option value="">Select Post</option>
<option>President's Assistant</option>
<option>DM</option>
<option>DM's Assistant
