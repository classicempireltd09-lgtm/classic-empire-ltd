<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Classic Empire Ltd — Marksheet Settings</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080808;
  color:#fff;
}

.container{
  width:94%;
  max-width:900px;
  margin:30px auto;
}

.header{
  text-align:center;
  padding:25px;
  border:1px solid #d4af37;
  border-radius:15px;
  background:#111;
}

.logo{
  width:100px;
  max-width:35%;
  margin-bottom:10px;
}

h1{
  color:#ffd700;
  margin:8px 0;
}

.subtitle{
  color:#bbb;
}

.card{
  background:#111;
  border:1px solid #333;
  border-radius:15px;
  padding:22px;
  margin-top:20px;
}

h2{
  color:#ffd700;
  margin-top:0;
}

label{
  display:block;
  margin:18px 0 8px;
  font-weight:bold;
}

input[type="file"]{
  width:100%;
  padding:12px;
  background:#181818;
  color:#fff;
  border:1px solid #555;
  border-radius:8px;
}

.preview{
  margin-top:15px;
  min-height:100px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#080808;
  border:1px dashed #555;
  border-radius:10px;
  padding:15px;
}

.preview img{
  max-width:260px;
  max-height:180px;
  object-fit:contain;
}

button{
  width:100%;
  margin-top:25px;
  padding:14px;
  border:0;
  border-radius:8px;
  background:#ffd700;
  color:#000;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.status{
  margin-top:18px;
  padding:14px;
  border-radius:8px;
  display:none;
  white-space:pre-wrap;
}

.success{
  display:block;
  background:#123b1b;
  border:1px solid #2ecc71;
  color:#8cffaa;
}

.error{
  display:block;
  background:#3b1212;
  border:1px solid #ff4444;
  color:#ff9999;
}

.info{
  display:block;
  background:#171717;
  border:1px solid #555;
  color:#ddd;
}

.current{
  color:#aaa;
  font-size:13px;
  margin-top:10px;
  word-break:break-all;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#ffd700;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <img
      src="classic-empire-logo.png"
      class="logo"
      alt="Classic Empire Ltd"
    >

    <h1>Marksheet Settings</h1>
    <div class="subtitle">
      Classic Empire Ltd — President/Admin Only
    </div>
  </div>

  <div class="card">

    <h2>Official Seal</h2>

    <label for="sealFile">
      Upload Official Seal
    </label>

    <input
      type="file"
      id="sealFile"
      accept="image/png,image/jpeg,image/webp"
    >

    <div class="preview" id="sealPreview">
      Current seal will appear here
    </div>

    <div class="current" id="sealCurrent"></div>


    <h2 style="margin-top:35px;">
      President Signature
    </h2>

    <label for="signatureFile">
      Upload President Signature
    </label>

    <input
      type="file"
      id="signatureFile"
      accept="image/png,image/jpeg,image/webp"
    >

    <div class="preview" id="signaturePreview">
      Current signature will appear here
    </div>

    <div class="current" id="signatureCurrent"></div>


    <button id="saveBtn">
      Save Marksheet Settings
    </button>

    <div id="statusBox" class="status"></div>

  </div>

  <a class="back" href="admin.html">
    ← Back to Admin Panel
  </a>

</div>


<script>

const SUPABASE_URL =
  "https://hjatspkzgoddcpgwfkxo.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_nw9-8f_8dfZBN7M2q27Wrg_NXk6Eij_";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const BUCKET =
  "marksheet-assets";


let currentSealUrl = null;
let currentSignatureUrl = null;


const sealFile =
  document.getElementById("sealFile");

const signatureFile =
  document.getElementById("signatureFile");

const saveBtn =
  document.getElementById("saveBtn");

const statusBox =
  document.getElementById("statusBox");

const sealPreview =
  document.getElementById("sealPreview");

const signaturePreview =
  document.getElementById("signaturePreview");

const sealCurrent =
  document.getElementById("sealCurrent");

const signatureCurrent =
  document.getElementById("signatureCurrent");


function showStatus(message,type){

  statusBox.textContent = message;

  statusBox.className =
    "status " + type;
}


function previewFile(input,preview){

  const file = input.files[0];

  if(!file){
    return;
  }

  if(file.size > 10 * 1024 * 1024){

    showStatus(
      "Image 10 MB से बड़ी है।",
      "error"
    );

    input.value = "";
    return;
  }

  const url =
    URL.createObjectURL(file);

  preview.innerHTML =
    `<img src="${url}" alt="Preview">`;
}


sealFile.addEventListener(
  "change",
  function(){

    previewFile(
      sealFile,
      sealPreview
    );

  }
);


signatureFile.addEventListener(
  "change",
  function(){

    previewFile(
      signatureFile,
      signaturePreview
    );

  }
);


async function checkAdmin(){

  const {
    data: {
      session
    }
  } = await supabaseClient
    .auth
    .getSession();


  if(!session){

    showStatus(
      "Login required. पहले President/Admin login करें।",
      "error"
    );

    saveBtn.disabled = true;

    return false;
  }


  const {
    data,
    error
  } = await supabaseClient
    .rpc("check_admin_access");


  if(error){

    showStatus(
      "Admin access check failed:\n" +
      error.message,
      "error"
    );

    saveBtn.disabled = true;

    return false;
  }


  if(
    !data ||
    data.allowed !== true
  ){

    showStatus(
      "केवल President इस Marksheet Settings को बदल सकता है।",
      "error"
    );

    saveBtn.disabled = true;

    return false;
  }


  return true;
}


async function loadSettings(){

  const {
    data,
    error
  } = await supabaseClient
    .rpc("get_marksheet_settings");


  if(error){

    showStatus(
      "Settings load नहीं हुई:\n" +
      error.message,
      "error"
    );

    return;
  }


  let settings = data;


  if(typeof settings === "string"){

    try{
      settings = JSON.parse(settings);
    }catch(e){}
  }


  if(Array.isArray(settings)){
    settings = settings[0];
  }


  if(!settings){
    return;
  }


  currentSealUrl =
    settings.seal_url ||
    settings.official_seal_url ||
    null;


  currentSignatureUrl =
    settings.signature_url ||
    settings.president_signature_url ||
    null;


  if(currentSealUrl){

    sealPreview.innerHTML =
      `<img
        src="${currentSealUrl}"
        alt="Official Seal"
      >`;

    sealCurrent.textContent =
      "Current Seal: " +
      currentSealUrl;
  }


  if(currentSignatureUrl){

    signaturePreview.innerHTML =
      `<img
        src="${currentSignatureUrl}"
        alt="President Signature"
      >`;

    signatureCurrent.textContent =
      "Current Signature: " +
      currentSignatureUrl;
  }

}


async function uploadImage(file,type){

  if(!file){
    return null;
  }


  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const safeExtension =
    ["png","jpg","jpeg","webp"]
      .includes(extension)
      ? extension
      : "png";


  const fileName =
    type +
    "-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2,8)
    +
    "." +
    safeExtension;


  const filePath =
    "marksheet/" +
    fileName;


  const {
    error
  } = await supabaseClient
    .storage
    .from(BUCKET)
    .upload(
      filePath,
      file,
      {
        cacheControl:"3600",
        upsert:false,
        contentType:file.type
      }
    );


  if(error){

    throw new Error(
      "Upload failed: " +
      error.message
    );
  }


  const {
    data
  } = supabaseClient
    .storage
    .from(BUCKET)
    .getPublicUrl(filePath);


  if(!data || !data.publicUrl){

    throw new Error(
      "Public URL generate नहीं हुई।"
    );
  }


  return data.publicUrl;
}


async function saveSettings(){

  saveBtn.disabled = true;

  showStatus(
    "Saving... कृपया wait करें।",
    "info"
  );


  try{

    const allowed =
      await checkAdmin();

    if(!allowed){
      return;
    }


    let sealUrl =
      currentSealUrl;

    let signatureUrl =
      currentSignatureUrl;


    /*
      Upload new seal
    */

    if(sealFile.files.length > 0){

      showStatus(
        "Official Seal upload हो रही है...",
        "info"
      );

      sealUrl =
        await uploadImage(
          sealFile.files[0],
          "official-seal"
        );
    }


    /*
      Upload new signature
    */

    if(signatureFile.files.length > 0){

      showStatus(
        "President Signature upload हो रही है...",
        "info"
      );

      signatureUrl =
        await uploadImage(
          signatureFile.files[0],
          "president-signature"
        );
    }


    /*
      Save URLs
    */

    showStatus(
      "Settings database में save हो रही हैं...",
      "info"
    );


    const {
      data,
      error
    } = await supabaseClient
      .rpc(
        "update_marksheet_settings",
        {
          input_seal_url:
            sealUrl,

          input_signature_url:
            signatureUrl
        }
      );


    if(error){

      throw new Error(
        "Database save failed: " +
        error.message
      );
    }


    let result = data;

    if(typeof result === "string"){

      try{
        result = JSON.parse(result);
      }catch(e){}
    }


    if(
      result &&
      result.success === false
    ){

      throw new Error(
        result.message ||
        "Settings save नहीं हुईं।"
      );
    }


    currentSealUrl =
      sealUrl;

    currentSignatureUrl =
      signatureUrl;


    sealFile.value = "";
    signatureFile.value = "";


    await loadSettings();


    showStatus(
      "✅ Marksheet Seal और President Signature successfully save हो गए।",
      "success"
    );

  }catch(error){

    console.error(error);

    showStatus(
      "❌ Failed:\n" +
      error.message,
      "error"
    );

  }finally{

    saveBtn.disabled = false;

  }

}


saveBtn.addEventListener(
  "click",
  saveSettings
);


(async function(){

  saveBtn.disabled = true;

  const allowed =
    await checkAdmin();

  if(allowed){

    await loadSettings();

    saveBtn.disabled = false;

    showStatus(
      "Settings ready हैं। Seal और Signature upload कर सकते हैं।",
      "info"
    );
  }

})();

</script>

</body>
</html>
