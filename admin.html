/* =========================
   START EXAM
========================= */

async function startExam(){

const code =
document.getElementById("examCode")
.value
.trim()
.toUpperCase();

const post =
document.getElementById("post")
.value;

const message =
document.getElementById("loginMessage");

if(!code){

message.textContent =
"कृपया Exam Code डालें।";

return;
}

if(!post){

message.textContent =
"कृपया Post चुनें।";

return;
}

message.textContent =
"Exam Code सत्यापित किया जा रहा है...";

try{

const response = await fetch(
SUPABASE_URL +
"/rest/v1/rpc/verify_exam_code",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY,
"Authorization":
"Bearer " + SUPABASE_KEY
},

body:JSON.stringify({
input_code:code,
input_post:post
})
}
);

const data =
await response.json();

if(!response.ok){

throw new Error(
"Verification failed"
);

}

if(!data.success){

message.textContent =
data.message ||
"Exam Code अमान्य है।";

return;
}

verifiedCode = code;
currentPost = post;
currentCandidate =
data.applicant_name || "Candidate";

document.getElementById(
"loginSection"
).style.display="none";

document.getElementById(
"examSection"
).style.display="block";

document.getElementById(
"examTitle"
).textContent =
"Classic Empire - " + post + " Examination";

document.getElementById(
"candidateInfo"
).textContent =
"Applicant: " +
currentCandidate +
" | Post: " +
post;

loadQuestions(post);

window.scrollTo({
top:0,
behavior:"smooth"
});

}

catch(error){

console.error(error);

message.textContent =
"Exam Code verify नहीं हुआ। कृपया Code और Post जाँचें।";

}

}


/* =========================
   LOAD QUESTIONS
========================= */

function loadQuestions(post){

const exam =
exams[post];

const objective =
document.getElementById(
"objectiveQuestions"
);

const subjective =
document.getElementById(
"subjectiveQuestions"
);

objective.innerHTML="";
subjective.innerHTML="";


exam.objective.forEach(
(item,index)=>{

const box =
document.createElement("div");

box.className="question";

let html =
`<div class="question-title">
प्रश्न ${index+1}. ${item.q}
</div>`;

item.o.forEach(
(option,optIndex)=>{

const letter =
["A","B","C","D"][optIndex];

html += `
<label class="option">
<input
type="radio"
name="q${index}"
value="${optIndex}"
required
>
<strong>${letter}.</strong>
${option}
</label>
`;

});

box.innerHTML=html;

objective.appendChild(box);

});


exam.subjective.forEach(
(item,index)=>{

const box =
document.createElement("div");

box.className="question";

box.innerHTML=`
<div class="question-title">
प्रश्न ${index+11}. ${item}
</div>

<textarea
class="subjective"
name="subjective${index}"
placeholder="अपना उत्तर यहाँ लिखें..."
required
></textarea>
`;

subjective.appendChild(box);

});

}


/* =========================
   SUBMIT EXAM
========================= */

document.getElementById(
"examForm"
).addEventListener(
"submit",
async function(event){

event.preventDefault();

const exam =
exams[currentPost];

let score = 0;

exam.objective.forEach(
(item,index)=>{

const selected =
document.querySelector(
`input[name="q${index}"]:checked`
);

if(
selected &&
Number(selected.value) === item.a
){
score++;
}

});

const total =
exam.objective.length;

const percentage =
(score / total) * 100;

const passed =
percentage >= 60;


if(!passed){

showResult(
score,
total,
percentage,
false
);

return;

}


/* Code is marked used only after successful submission */

try{

const response = await fetch(
SUPABASE_URL +
"/rest/v1/rpc/submit_exam_code",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY,
"Authorization":
"Bearer " + SUPABASE_KEY
},

body:JSON.stringify({
input_code:verifiedCode
})
}
);

const data =
await response.json();

if(!response.ok || !data.success){

alert(
"Exam submit नहीं हुआ। कृपया दोबारा प्रयास करें।"
);

return;

}

showResult(
score,
total,
percentage,
true
);

}
catch(error){

console.error(error);

alert(
"Server से संपर्क नहीं हो पाया।"
);

}

});


/* =========================
   RESULT
========================= */

function showResult(
score,
total,
percentage,
passed
){

document.getElementById(
"examForm"
).style.display="none";

const result =
document.getElementById("result");

result.style.display="block";

document.getElementById(
"score"
).textContent =
score + " / " + total +
" — " +
percentage.toFixed(0) +
"%";

if(passed){

document.getElementById(
"resultMessage"
).innerHTML =
`
<h3 style="color:#55ff88;">
PASS
</h3>

<p style="margin-top:10px;color:#bbb;">
आपने Objective Examination में आवश्यक अंक प्राप्त कर लिए हैं।
</p>

<p style="margin-top:10px;color:#bbb;">
आपके वर्णनात्मक उत्तरों का मूल्यांकन प्रशासन द्वारा किया जाएगा।
</p>

<p style="margin-top:10px;color:#ffd700;">
Exam Code अब इस्तेमाल हो चुका है।
</p>
`;

}else{

document.getElementById(
"resultMessage"
).innerHTML =
`
<h3 style="color:#ff5555;">
FAIL
</h3>

<p style="margin-top:10px;color:#bbb;">
पास होने के लिए कम से कम 60% अंक आवश्यक हैं।
</p>

<p style="margin-top:10px;color:#ffd700;">
आपका Exam Code अभी इस्तेमाल नहीं हुआ है।
</p>
`;

}

}
